:root {
  /* Layout: Der Tisch füllt die Mitte, die eigene Hand liegt unten. Texte stehen linksbündig.
     Farbe tragen nur die Karten, alles andere bleibt ruhig in Tinte und Papier. */
  --table: #e7e4ee;
  --surface: #f6f4fa;
  --raised: #ffffff;
  --ink: #221638;
  --ink2: #5f5679;
  --line: #cfc9dd;
  --veil: rgba(34, 22, 56, 0.5);
  --good: #157a55;
  --bad: #c93a26;
  --glut: #e4502e;
  --flut: #2757c9;
  --laub: #157a55;
  --licht: #f5b920;
  --cream: #fff6e6;
  --card-ink: #221638;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --lift: 0 1px 2px rgba(34, 22, 56, 0.22), 0 6px 16px rgba(34, 22, 56, 0.14);
  --edge: rgba(20, 12, 36, 0.38);
  --cw: 66px;
  --sw: 86px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --table: #1b1430;
    --surface: #261c44;
    --raised: #32265c;
    --ink: #f1eef8;
    --ink2: #aca3c6;
    --line: #43366e;
    --veil: rgba(8, 5, 18, 0.66);
    --good: #4ccb96;
    --bad: #ff8a73;
    --lift: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.4);
    --edge: rgba(255, 255, 255, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --table: #1b1430;
  --surface: #261c44;
  --raised: #32265c;
  --ink: #f1eef8;
  --ink2: #aca3c6;
  --line: #43366e;
  --veil: rgba(8, 5, 18, 0.66);
  --good: #4ccb96;
  --bad: #ff8a73;
  --lift: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.4);
  --edge: rgba(255, 255, 255, 0.3);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  touch-action: manipulation;
}
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--table);
  color: var(--ink);
  font: 15px/1.4 var(--body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  touch-action: manipulation;
  cursor: pointer;
}
h1,
h2,
h3,
p {
  margin: 0;
}
[hidden] {
  display: none !important;
}

#app {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.scroll {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* ---------- Karten ---------- */
.card {
  display: block;
  padding: 0;
  border: 0;
  background: none;
  width: var(--cw);
  height: calc(var(--cw) * 1.42);
  border-radius: calc(var(--cw) * 0.1);
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--edge), 0 2px 5px rgba(20, 12, 36, 0.28);
  flex: none;
}
.cardsvg {
  display: block;
  width: 100%;
  height: 100%;
}
.cardsvg text {
  font-family: var(--display);
  font-weight: 800;
}

/* ---------- Bausteine ---------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 54px;
  padding: 6px 18px;
  border-radius: 15px;
  border: 2px solid var(--ink);
  background: transparent;
  font: 800 23px/1.05 var(--display);
  letter-spacing: 0.2px;
  text-align: center;
}
.btn.primary {
  background: var(--ink);
  color: var(--table);
}
.btn.plain {
  min-height: 46px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 600 15px/1.2 var(--body);
  letter-spacing: 0;
}
.btn:disabled {
  opacity: 0.42;
  cursor: default;
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
}
:focus-visible {
  outline: 3px solid var(--flut);
  outline-offset: 2px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label,
.label {
  font: 800 18px/1 var(--display);
}
.field input {
  height: 50px;
  padding: 0 14px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--raised);
  font-size: 17px;
  -webkit-user-select: text;
  user-select: text;
  width: 100%;
}
.field input:focus {
  outline: none;
  border-color: var(--ink);
}
.hint {
  color: var(--ink2);
  font-size: 13px;
}
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 6px;
}
.seg button {
  min-height: 46px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 800 20px/1 var(--display);
}
.seg button[aria-pressed='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--table);
}
.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  padding: 10px 0;
  border: 0;
  background: none;
  text-align: left;
}
.switch .knob {
  flex: none;
  width: 50px;
  height: 30px;
  border-radius: 15px;
  background: var(--line);
  position: relative;
  transition: background 0.15s;
}
.switch .knob::after {
  content: '';
  position: absolute;
  left: 3px;
  top: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--raised);
  transition: transform 0.15s;
}
.switch[aria-checked='true'] .knob {
  background: var(--ink);
}
.switch[aria-checked='true'] .knob::after {
  transform: translateX(20px);
  background: var(--table);
}
.switch b {
  display: block;
  font: 800 19px/1.1 var(--display);
}
.switch span span {
  display: block;
  color: var(--ink2);
  font-size: 13px;
  margin-top: 2px;
}

/* ---------- Start ---------- */
.home {
  padding: 14px 20px 22px;
  gap: 16px;
}
.fan {
  position: relative;
  height: 196px;
  flex: none;
}
.fan .card {
  position: absolute;
  left: 50%;
  top: 22px;
  --cw: 100px;
  margin-left: -50px;
  transform-origin: 50% 135%;
  animation: fanIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
@keyframes fanIn {
  from {
    transform: rotate(0deg) translateY(30px);
    opacity: 0;
  }
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 800 60px/0.9 var(--display);
  letter-spacing: -0.5px;
}
.lede {
  color: var(--ink2);
  font-size: 16px;
  max-width: 32ch;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.grow {
  flex: 1;
  min-height: 0;
}

/* ---------- Unterseiten (Solo-Einstellungen, Mehrspieler) ---------- */
.page {
  padding: 8px 20px 22px;
  gap: 18px;
}
.pagehead {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 50px;
  margin: 0 -8px;
}
.pagehead h1 {
  font: 800 30px/1 var(--display);
}
.iconbtn {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--surface);
}
.iconbtn svg {
  width: 22px;
  height: 22px;
}
.code {
  font: 800 64px/1 var(--display);
  letter-spacing: 6px;
  -webkit-user-select: text;
  user-select: text;
}
.codein input {
  font: 800 30px/1 var(--display);
  letter-spacing: 6px;
  text-transform: uppercase;
  height: 58px;
}
.people {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.people li {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  padding: 0 14px;
  border-radius: 13px;
  background: var(--surface);
  border: 1.5px solid var(--line);
}
.people li b {
  font: 800 21px/1 var(--display);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.people li .tag {
  font-size: 12px;
  color: var(--ink2);
}
.people li.bot {
  border-style: dashed;
  background: transparent;
}
.people li.off b {
  opacity: 0.5;
}
.banner {
  padding: 10px 14px;
  border-radius: 13px;
  border: 1.5px solid var(--bad);
  color: var(--bad);
  font-size: 14px;
  font-weight: 600;
}

/* ---------- Spieltisch ---------- */
.top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px 4px;
  min-height: 54px;
  flex: none;
}
.topmid {
  flex: 1;
  min-width: 0;
}
.topmid b {
  display: block;
  font: 800 22px/1 var(--display);
  white-space: nowrap;
}
.topmid span {
  display: block;
  font-size: 12px;
  line-height: 1.2;
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.trump {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 12px 0 7px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 800 19px/1 var(--display);
  white-space: nowrap;
  flex: none;
}
.trump .sw {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--line);
}
.trump .sw svg {
  width: 20px;
  height: 20px;
}
.trump small {
  display: block;
  font: 600 10.5px/1 var(--body);
  color: var(--ink2);
  margin-bottom: 2px;
}
.net {
  margin: 0 10px 2px;
  padding: 7px 12px;
  border-radius: 11px;
  background: var(--bad);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  flex: none;
}
.table {
  position: relative;
  flex: 1;
  min-height: 0;
}
.seat {
  position: absolute;
  width: var(--sw);
  height: 60px;
  margin: -30px 0 0 calc(var(--sw) / -2);
  padding: 7px 9px 6px;
  border-radius: 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
}
.seat.turn {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px var(--line);
}
.seat.away {
  opacity: 0.55;
}
.seat .nm {
  font: 800 18px/1 var(--display);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.seat .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 16px;
}
.pts {
  font: 800 16px/1 var(--display);
  color: var(--ink2);
}
.tally {
  display: flex;
  align-items: center;
  gap: 3px;
  font: 800 16px/1 var(--display);
  min-height: 12px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.7px solid var(--ink);
  flex: none;
}
.dot.won {
  background: var(--ink);
}
.dot.over {
  background: var(--bad);
  border-color: var(--bad);
}
.tally .zero {
  font: 800 15px/1 var(--display);
}
.tally .wait {
  color: var(--ink2);
  font: 600 11px/1 var(--body);
}
.badge {
  position: absolute;
  top: -9px;
  right: -7px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--table);
  font: 800 13px/20px var(--display);
}
.bubble {
  position: absolute;
  left: 50%;
  top: 100%;
  margin-top: 7px;
  transform: translateX(-50%);
  padding: 7px 11px;
  border-radius: 11px;
  background: var(--ink);
  color: var(--table);
  font: 800 19px/1 var(--display);
  white-space: nowrap;
  pointer-events: none;
  z-index: 6;
  animation: pop 2.1s ease forwards;
}
@keyframes pop {
  0% {
    opacity: 0;
    transform: translateX(-50%) scale(0.6);
  }
  8% {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  82% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}
#trick .card {
  position: absolute;
  left: 0;
  top: 0;
  cursor: default;
  transition: filter 0.25s, box-shadow 0.25s;
}
#trick .card.dim {
  filter: brightness(0.72) saturate(0.7);
}
#trick .card.win {
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--table), 0 8px 18px rgba(20, 12, 36, 0.4);
  z-index: 30 !important;
}

.mebar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 10px;
  padding: 8px 12px;
  min-height: 44px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  flex: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.mebar .st {
  flex: 1;
  min-width: 0;
  font: 800 20px/1.05 var(--display);
}
.mebar.turn {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--table);
}
.mebar.turn .dot {
  border-color: var(--table);
}
.mebar.turn .dot.won {
  background: var(--table);
}
.mebar.turn .dot.over {
  border-color: var(--bad);
}
.mebar.turn .pts {
  color: var(--table);
}
.mebar .gb {
  position: static;
  flex: none;
}
.mebar.turn .gb {
  background: var(--table);
  color: var(--ink);
}
.hand {
  position: relative;
  flex: none;
  height: 124px;
  transition: height 0.25s;
}
.hand .card {
  position: absolute;
  left: 0;
  top: 0;
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.2s, opacity 0.2s;
}
.hand .card.off {
  filter: brightness(0.74) saturate(0.45);
}
.hand .card.sel {
  box-shadow: 0 0 0 2.5px var(--ink), 0 0 0 5px var(--table), 0 8px 16px rgba(20, 12, 36, 0.4);
}
.hand .card.pending {
  opacity: 0.55;
}
.hand .card.nope {
  animation: nope 0.3s;
}
@keyframes nope {
  25% {
    margin-left: -5px;
  }
  75% {
    margin-left: 5px;
  }
}

/* ---------- Ansage / Trumpfwahl ---------- */
.panel {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 8px;
  z-index: 40;
  padding: 14px;
  border-radius: 18px;
  border: 2px solid var(--ink);
  background: var(--raised);
  box-shadow: var(--lift);
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: rise 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes rise {
  from {
    transform: translateY(16px);
    opacity: 0;
  }
}
.panel h2 {
  font: 800 25px/1 var(--display);
}
.chips {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.chip {
  height: 44px;
  border-radius: 11px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 800 22px/1 var(--display);
  padding: 0;
}
.chip[aria-pressed='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--table);
}
.chip:disabled {
  opacity: 0.32;
  text-decoration: line-through;
}
.suitpick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.suitpick button {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 56px;
  padding: 0 14px;
  border: 0;
  border-radius: 13px;
  font: 800 24px/1 var(--display);
}
.suitpick svg {
  width: 26px;
  height: 26px;
}

/* ---------- Blätter (Rundenende, Block, Regeln, Menü) ---------- */
.sheet {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: var(--veil);
  animation: fade 0.2s;
}
@keyframes fade {
  from {
    opacity: 0;
  }
}
.sheetbody {
  max-height: 94%;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheethead {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sheethead h2 {
  flex: 1;
  font: 800 30px/1 var(--display);
}
.results {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.results li {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 4px 12px;
  padding: 9px 14px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--raised);
}
.results li.me {
  border-color: var(--ink);
}
.results .nm {
  font: 800 22px/1 var(--display);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.results .sub {
  grid-column: 1;
  font-size: 12.5px;
  color: var(--ink2);
}
.results .dl {
  grid-row: 1 / span 2;
  grid-column: 2;
  font: 800 22px/1 var(--display);
  padding: 6px 9px;
  border-radius: 9px;
  min-width: 52px;
  text-align: center;
}
.results .dl.good {
  background: var(--good);
  color: #fff;
}
.results .dl.bad {
  color: var(--bad);
  border: 1.5px solid var(--bad);
}
.results .tt {
  grid-row: 1 / span 2;
  grid-column: 3;
  font: 800 28px/1 var(--display);
  min-width: 52px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.block {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.block th {
  position: sticky;
  top: 0;
  background: var(--surface);
  font: 800 16px/1.1 var(--display);
  padding: 6px 3px;
  text-align: right;
  max-width: 62px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border-bottom: 2px solid var(--ink);
}
.block th:first-child,
.block td:first-child {
  text-align: left;
  width: 34px;
}
.block td {
  padding: 5px 3px;
  text-align: right;
  border-bottom: 1px solid var(--line);
  line-height: 1.1;
}
.block td b {
  display: block;
  font: 800 19px/1 var(--display);
}
.block td small {
  font-size: 11px;
  color: var(--ink2);
}
.block td.hit small {
  color: var(--good);
  font-weight: 700;
}
.block td .rs {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  font: 800 15px/1 var(--display);
  background: var(--line);
}
.block td .rs svg {
  width: 13px;
  height: 13px;
}
.menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rules {
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-user-select: text;
  user-select: text;
}
.rules h3 {
  font: 800 22px/1.1 var(--display);
  margin-bottom: 4px;
}
.rules p,
.rules li {
  font-size: 15px;
  line-height: 1.45;
  max-width: 62ch;
}
.rules ul {
  margin: 0;
  padding-left: 18px;
}
.legend {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.legend figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12.5px;
  line-height: 1.25;
  color: var(--ink2);
}
.legend .card {
  --cw: 100%;
  width: 100%;
  height: auto;
  aspect-ratio: 100 / 142;
  border-radius: 8px;
}
.legend b {
  display: block;
  color: var(--ink);
  font: 800 18px/1 var(--display);
}
.minirow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.minirow .card {
  --cw: 58px;
}
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(200px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 80;
  max-width: 86%;
  padding: 11px 16px;
  border-radius: 13px;
  background: var(--ink);
  color: var(--table);
  font-size: 14.5px;
  font-weight: 600;
  text-align: center;
  box-shadow: var(--lift);
  animation: rise 0.2s;
}

/* ---------- Version 1.2: Reaktionen, QR-Code, Rechtliches ---------- */
.stickyfoot {
  position: sticky;
  bottom: 0;
  margin: 0 -20px -22px;
  padding: 12px 20px 22px;
  background: linear-gradient(to top, var(--table) 78%, transparent);
}
.switch[aria-disabled='true'] {
  opacity: 0.4;
}
.rx {
  flex: none;
  width: 38px;
  height: 38px;
  margin: -4px -6px -4px 0;
  border-radius: 11px;
  border: 1.5px solid var(--line);
  background: var(--raised);
  display: grid;
  place-items: center;
  padding: 0;
}
.rx svg {
  width: 22px;
  height: 22px;
}
.mebar.turn .rx {
  background: transparent;
  border-color: var(--table);
  color: var(--table);
}
.rxpal {
  position: absolute;
  right: 10px;
  bottom: 8px;
  z-index: 45;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px;
  border-radius: 16px;
  border: 2px solid var(--ink);
  background: var(--raised);
  box-shadow: var(--lift);
  animation: rise 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.rxpal button {
  min-width: 58px;
  height: 50px;
  padding: 0 8px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 800 18px/1 var(--display);
}
.rxpal button.emo {
  font: 26px/1 var(--body);
}
.bubble.emo {
  font: 30px/1 var(--body);
  padding: 7px 10px;
  background: var(--raised);
  border: 2px solid var(--ink);
  animation-duration: 2.8s;
}
.bubble.word {
  animation-duration: 2.8s;
}
.bubble.self {
  top: auto;
  bottom: 10px;
  margin-top: 0;
  z-index: 44;
}
.coderow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.coderow .code {
  font-size: 54px;
  letter-spacing: 4px;
}
.qr {
  flex: none;
  width: 124px;
  height: 124px;
  padding: 6px;
  border-radius: 12px;
  background: #fff;
}
.qr svg {
  display: block;
  width: 100%;
  height: 100%;
}
button.qr {
  border: 0;
}
.qr.big {
  width: min(100%, 320px);
  height: auto;
  aspect-ratio: 1;
  align-self: center;
  padding: 10px;
}
.legal {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 24px;
}
.legal button {
  border: 0;
  background: none;
  padding: 6px 0;
  color: var(--ink2);
  font-size: 13px;
  text-decoration: underline;
}
.legaltext {
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-user-select: text;
  user-select: text;
}
.legaltext h3 {
  font: 800 21px/1.1 var(--display);
  margin-bottom: 3px;
}
.legaltext p,
.legaltext li {
  font-size: 14.5px;
  line-height: 1.45;
  max-width: 64ch;
}
.legaltext ul {
  margin: 0;
  padding-left: 18px;
}
.legaltext a {
  color: inherit;
}

@media (max-height: 620px) {
  .fan {
    height: 150px;
  }
  .fan .card {
    --cw: 76px;
    margin-left: -38px;
    top: 16px;
  }
  .wordmark {
    font-size: 50px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- 1.3: Tische, Nummer der Partie ---------- */
.tables {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.ttile {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 176px;
  padding: 10px;
  border-radius: 16px;
  border: 1.5px solid var(--line);
  background: var(--raised);
  text-align: left;
  color: var(--ink);
}
.ttile.new {
  align-items: flex-start;
  justify-content: flex-end;
  padding: 14px;
  border-color: var(--ink);
  background: var(--ink);
  color: var(--table);
}
.ttile.new .plus {
  position: relative;
  width: 44px;
  height: 44px;
  margin-bottom: auto;
  border-radius: 50%;
  border: 2px solid currentColor;
}
.ttile.new .plus::before,
.ttile.new .plus::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 20px;
  height: 2.5px;
  margin: -1.25px 0 0 -10px;
  border-radius: 2px;
  background: currentColor;
}
.ttile.new .plus::after {
  transform: rotate(90deg);
}
.ttile.new b {
  font: 800 24px/1 var(--display);
}
.ttile.new .sub {
  font-size: 12px;
  line-height: 1.3;
  opacity: 0.75;
}
.ttile.empty {
  justify-content: center;
  border-style: dashed;
  background: transparent;
  color: var(--ink2);
  font-size: 14px;
  line-height: 1.35;
}
.ttile.busy {
  background: var(--surface);
}
.ttile.busy:disabled {
  opacity: 1;
}
.ttile.busy .tseats,
.ttile.busy .thead {
  opacity: 0.62;
}
.thead {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-height: 22px;
}
.ttag {
  padding: 3px 7px;
  border-radius: 999px;
  background: var(--table);
  font: 800 14px/1 var(--display);
  letter-spacing: 0.2px;
}
.tseats {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.tseats li {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
}
.tseats .nm {
  min-width: 0;
  overflow: hidden;

<template id="rulesTpl">
  <div class="rules">
    <section>
      <h3>Die Karten</h3>
      <p>60 Karten: die Werte 1 bis 13 in vier Farben, dazu 4 Zauberer und 4 Narren. Den Wert einer Karte siehst du auch am Bild: Je höher die Karte, desto größer das Feuer, desto höher das Wasser, desto mehr Blätter und Strahlen.</p>
    </section>
    <div class="legend" id="legend"></div>
    <section>
      <h3>Runden</h3>
      <p>In Runde 1 bekommt jeder eine Karte, in Runde 2 zwei, und so weiter. Zu dritt sind es 20 Runden, zu viert 15, zu fünft 12, zu sechst 10.</p>
    </section>
    <section>
      <h3>Trumpf</h3>
      <p>Nach dem Geben wird die nächste Karte aufgedeckt. Ihre Farbe ist Trumpf. Liegt ein Narr auf, gibt es keinen Trumpf. Liegt ein Zauberer auf, wird die Trumpffarbe ausgelost. Nach der Originalregel wählt sie in diesem Fall der Geber, das lässt sich vor der Partie einschalten. In der letzten Runde sind alle Karten verteilt, dann gibt es ebenfalls keinen Trumpf.</p>
    </section>
    <section>
      <h3>Ansagen</h3>
      <p>Reihum, beginnend links vom Geber, sagt jeder an, wie viele Stiche er in dieser Runde macht. Null ist erlaubt.</p>
    </section>
    <section>
      <h3>Spielen</h3>
      <ul>
        <li>Wer links vom Geber sitzt, spielt aus. Danach spielt immer aus, wer den letzten Stich gewonnen hat.</li>
        <li>Die angespielte Farbe musst du bedienen. Hast du sie nicht, spielst du eine beliebige Karte.</li>
        <li>Zauberer und Narr darfst du immer spielen, auch wenn du bedienen könntest.</li>
        <li>Liegt ein Zauberer als erste Karte, ist die Kartenwahl für alle frei. Liegt ein Narr als erste Karte, bestimmt die nächste Zahlenkarte die Farbe.</li>
      </ul>
    </section>
    <section>
      <h3>Wer den Stich bekommt</h3>
      <ul>
        <li>Der erste Zauberer im Stich gewinnt immer.</li>
        <li>Ohne Zauberer gewinnt der höchste Trumpf.</li>
        <li>Ohne Trumpf gewinnt die höchste Karte der angespielten Farbe.</li>
        <li>Ein Narr gewinnt nie. Liegen nur Narren, gewinnt der erste.</li>
      </ul>
    </section>
    <section>
      <h3>Wertung</h3>
      <p>Ansage genau getroffen: 20 Punkte plus 10 für jeden Stich. Daneben gelegen: 10 Minuspunkte für jeden Stich zu viel oder zu wenig. Nach der letzten Runde gewinnt, wer die meisten Punkte hat.</p>
    </section>
    <section>
      <h3>Anzeige am Tisch</h3>
      <p>Die Kreise neben einem Namen zeigen die Ansage. Ein gefüllter Kreis ist ein gewonnener Stich, ein leerer fehlt noch, ein roter ist einer zu viel. Der Geber trägt ein G.</p>
    </section>
    <section>
      <h3>Kurze Partie</h3>
      <p>Statt aller Runden werden 8 gespielt. Die Kartenzahl steigt in größeren Schritten von einer Karte bis zur vollen Hand, zu viert zum Beispiel 1, 3, 5, 7, 9, 11, 13 und 15 Karten.</p>
    </section>
    <section>
      <h3>Variante Verdeckte Ansage</h3>
      <p>Alle wählen ihre Ansage gleichzeitig und geheim. Erst wenn jeder gewählt hat, werden die Ansagen aufgedeckt. Plus/Minus 1 ist dann nicht möglich.</p>
    </section>
    <section>
      <h3>Variante Plus/Minus 1</h3>
      <p>Die Summe aller Ansagen darf nicht der Zahl der Stiche entsprechen. Wer zuletzt ansagt, kann eine Zahl deshalb nicht wählen. So trifft nie die ganze Runde.</p>
    </section>
    <p class="hint">Zauberstich ist ein privates Projekt ohne Werbung und ohne Nutzerprofile. Gezählt wird nur, wie viele Partien mit Freunden gespielt werden, ohne Namen. Schrift: Big Shoulders Display, SIL Open Font License. QR-Code: qrcode-generator von Kazuhiko Arase, MIT-Lizenz.</p>
  </div>

      var bytes = [];

    if (this.mq && this.mq.open) this.mq.publish(this.base + '/' + suffix, bytes);
  }

  _in(topic, bytes) {
    const suffix = topic.slice(this.base.length + 1);
    this.inQ = this.inQ
      .then(() => unseal(this.key, bytes))
      .then((obj) => {
        if (obj && !this.closed && this.h.onMessage) this.h.onMessage(suffix, obj);
      })
      .catch(() => {});
  }

  _set(s) {
    if (this.state === s) return;
    this.state = s;
    if (this.h.onState) this.h.onState(s);
  }

  close() {
    this.closed = true;
    clearTimeout(this.rt);
    if (this.mq) this.mq.close();
    this.mq = null;
  }
}

/*
 * Probiert alle Relays gleichzeitig. Der erste in der Liste hat Vorrang;
 * antwortet er nicht schnell genug, gewinnt der beste der übrigen.
 */
function pickBroker() {
  const list = brokers();
  return new Promise((resolve, reject) => {
    let pending = list.length;
    let done = false;
    let best = -1;
    let timer = null;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (best >= 0) resolve(best);
      else reject(new Error('Kein Relay erreichbar. Prüfe deine Internetverbindung und versuche es noch einmal.'));
    };
    list.forEach((url, i) => {
      const mq = new MiniMqtt(url, {});
      mq.connect(7000).then(
        () => {
          mq.close();
          if (best < 0 || i < best) best = i;
          if (i === 0) finish();
          else if (!timer) timer = setTimeout(finish, 1500);
          if (--pending === 0) finish();
        },
        () => {
          if (--pending === 0) finish();
        }
      );
    });
  });
}

function setBrokers(list) {
  G.__ZS_BROKERS = list && list.length ? list : undefined;
}

function relayName(code) {
  try {
    return new URL(brokers()[brokerIndexFor(code)]).host;
  } catch (e) {
    return '';
  }
}

function toUI(v) {
  return { room: { v: v.v, code: v.code, phase: v.phase, owner: v.owner, players: v.players, cfg: v.cfg, nr: v.nr || 0, reacts: v.reacts || [] }, game: v.game };
}

/*
 * Offene Tische: Das leitende Handy eines Raums meldet ihn unter zst1/tische/<…> auf seinem Relay,
 * als gespeicherte Nachricht (retain), damit neue Besucher die Liste sofort sehen. Verschlüsselt mit einem
 * Schlüssel, den jede Kopie der App kennt: Das ist kein Geheimnis, hält aber fremde Nachrichten fern.
 */
const TABLES = 'zst1/tische/';
let tablesKey = null;
function tableKey() {
  if (!tablesKey) tablesKey = deriveKey('offene-tische');
  return tablesKey;
}
function tableTopic(code) {
  return TABLES + hash53('tisch|' + code);
}
function validTable(t) {
  return (
    t &&
    typeof t.code === 'string' &&
    /^[A-HJ-NP-Z]{5}$/.test(t.code) &&
    (t.phase === 'lobby' || t.phase === 'game') &&
    Array.isArray(t.names) &&
    t.names.length >= 1 &&
    t.names.length <= 6 &&
    t.names.every((x) => typeof x === 'string') &&
    Number.isInteger(t.size) &&
    t.size >= 3 &&
    t.size <= 6 &&
    Number.isFinite(t.at)
  );
}

/* Beobachtet die offenen Tische auf allen Relays, solange der Bildschirm offen ist. */
class TableWatch {
  constructor(onList) {
    this.onList = onList;
    this.tables = {};
    this.conns = [];
    this.closed = false;
    this.last = '';
    this.timer = setInterval(() => this._emit(), 2000);
  }

  async start() {
    this.key = await tableKey();
    for (const url of Array.from(new Set(brokers()))) this._conn(url, 0);
  }

  _conn(url, tries) {
    if (this.closed) return;
    const mq = new MiniMqtt(url, {
      keepalive: 25,
      onMessage: (t, b) => this._in(t, b),
      onClose: () => {
        if (this.closed) return;
        this.conns = this.conns.filter((c) => c !== mq);
        setTimeout(() => this._conn(url, tries + 1), Math.min(30000, 3000 * (tries + 1)));
      },
    });
    this.conns.push(mq);
    mq.connect(8000)
      .then(() => {
        if (this.closed) mq.close();
        else mq.subscribe([TABLES + '+']);
      })
      .catch(() => {});
  }

  async _in(topic, bytes) {
    if (this.closed || topic.indexOf(TABLES) !== 0) return;
    if (!bytes || !bytes.length) {
      delete this.tables[topic];
    } else {
      const t = await unseal(this.key, bytes);
      if (!validTable(t)) return;
      const game = t.phase === 'game';
      this.tables[topic] = {
        code: t.code,
        phase: t.phase,
        names: t.names.map((x) => x.slice(0, 16)),
        bots: game && Array.isArray(t.bots) ? t.names.map((_, i) => !!t.bots[i]) : t.names.map(() => false),
        size: t.size,
        open: !game && t.names.length < t.size,
        round: game && Number.isInteger(t.round) ? t.round : 0,
        rounds: game && Number.isInteger(t.rounds) ? t.rounds : 0,
        over: game && !!t.over,
        level: typeof t.level === 'string' ? t.level : '',
        short: !!t.short,
        hiddenBids: !!t.hiddenBids,
        at: t.at,
      };
    }
    this._emit();
  }

  list() {
    const now = Date.now();
    /* Tische mit freien Plätzen zuerst, dann wartende, dann laufende; jeweils die neuesten oben */
    const rank = (t) => (t.open ? 0 : t.phase === 'lobby' ? 1 : 2);
    return Object.values(this.tables)
      .filter((t) => now - t.at < T.stale && t.at - now < T.stale)
      .sort((a, b) => rank(a) - rank(b) || a.code.localeCompare(b.code));
  }

  _emit() {
    if (this.closed) return;
    const list = this.list();
    const sig = JSON.stringify(list.map((t) => [t.code, t.phase, t.names, t.size, t.round, t.over, t.short, t.hiddenBids, t.level]));
    if (sig === this.last) return;
    this.last = sig;
    this.onList(list);
  }

  close() {
    this.closed = true;
    clearInterval(this.timer);
    for (const c of this.conns) c.close();
    this.conns = [];
  }
}

/* Zeiten in Millisekunden. Tests dürfen sie über __ZS_TIMING = { scale } gemeinsam verkürzen. */
const K = (G.__ZS_TIMING && G.__ZS_TIMING.scale) || 1;
const T = {
  tick: 1000 * K,
  hb: 3000 * K, /* Lebenszeichen des leitenden Geräts */
  ghb: 5000 * K, /* Lebenszeichen der Mitspieler */
  away: 13000 * K, /* ohne Lebenszeichen gilt ein Mitspieler als abwesend */
  quiet: 9000 * K, /* so lange Stille, bevor ein anderes Gerät übernimmt */
  rank: 6000 * K, /* Abstand zwischen den Nachrückern */
  byeRank: 2500 * K, /* dasselbe, wenn sich das leitende Gerät abgemeldet hat */
  grace: 3000 * K, /* Schonfrist nach eigener Unterbrechung */
  claim: 1500 * K, /* Bedenkzeit nach der Ankündigung einer Übernahme */
  hold: 3000 * K, /* Pause nach einer gescheiterten Bewerbung */
  probe: 1800 * K, /* so lange sucht ein zurückkehrendes Leitgerät nach einem Nachfolger */
  search: 4500 * K, /* so lange sucht ein zurückkehrender Mitspieler nach dem Raum */
  find: 6400 * K, /* so lange sucht ein neuer Mitspieler nach dem Raum */
  ask: 1600 * K, /* Abstand der Anfragen beim Suchen */
  boost: 20000 * K,
  list: 20000 * K, /* so oft erneuert ein offener Tisch seinen Eintrag */
  stale: 65000 * K, /* ältere Einträge gelten als verwaist */
};

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function fresher(ep1, v1, ep2, v2) {
  return ep1 > ep2 || (ep1 === ep2 && v1 > v2);
}

/*
 * Eine Sitzung in einem Raum.
 *
 * Genau ein Gerät leitet die Partie (role 'host'): Es hält den Raum, prüft Züge und lässt die Bots spielen.
 * Alle anderen folgen (role 'guest'). Das leitende Gerät verteilt nach jeder Änderung eine verschlüsselte
 * Sicherung des Spielstands an alle. Meldet es sich ab oder bleibt es stumm, übernimmt ein anderes Gerät
 * mit dieser Sicherung. Jede Übernahme erhöht die Amtszeit (ep). Nachrichten älterer Amtszeiten zählen
 * nicht, und ein früheres Leitgerät, das zurückkommt, reiht sich als Mitspieler ein.
 *
 * o: { pid, name, onView(ui), onState(), onGone(text), onSave(rec), onRole(info), hooks, testCfg }
 */
class Session {
  constructor(o) {
    this.o = o;
    this.pid = o.pid;
    this.name = o.name;
    this.role = 'idle'; /* 'host' | 'guest' | 'probe' (sucht den Raum) */
    this.code = '';
    this.link = null;
    this.closed = false;
    this.ep = 0;
    this.hostPid = '';
    this.led = false; /* habe ich den Raum zuletzt geleitet? */
    this.hidden = false;
    this.hiddenAt = 0;
    this.paused = false;
    this.busy = false;
    this.echoAt = 0;
    /* leitend */
    this.room = null;
    this.guests = {};
    this.flush = null;
    this.defended = 0;
    this.byeBytes = null;
    this.listed = '';
    this.listedAt = 0;
    /* folgend */
    this.view = null;
    this.viewKey = '';
    this.viewN = 0;
    this.asking = null;
    this.acks = {};
    this.seq = Math.floor(Math.random() * 1e6);
    this.lastHost = 0;
    this.hostBye = false;
    this.byeAt = 0;
    this.leftHost = '';
    /* Übernahme */
    this.snap = null;
    this.claiming = null;
    this.claimSeen = 0;
    this.hold = 0;
    this.boost = 0;
    this.tick = null;
    this.ticks = 0;
  }

  get kind() {
    return this.role === 'host' ? 'host' : 'guest';
  }

  _hooks() {
    return Object.assign({}, this.o.hooks || {}, {
      onUpdate: () => this._dirty(),
      onGameStart: (room, info) => {
        if (!this.o.onGameStart) return;
        Promise.resolve(this.o.onGameStart(info))
          .then((nr) => room.setNr(info.gameNo, nr))
          .catch(() => {});
      },
    });
  }

  /* Den Tisch in der Liste „Offene Tische“ melden, aktualisieren oder austragen. */
  _list(force) {
    if (this.role !== 'host' || !this.room || !this.link || this.link.state !== 'online') return;
    const entry = this.room.listing();
    const now = Date.now();
    const sig = entry ? JSON.stringify(entry) : '';
    if (!force && sig === this.listed && (!entry || now - this.listedAt < T.list)) return;
    const topic = tableTopic(this.code);
    if (!entry) {
      if (this.listed && this.link.pub(topic, new Uint8Array(0), true)) this.listed = '';
      return;
    }
    this.listed = sig;
    this.listedAt = now;
    const link = this.link;
    tableKey()
      .then((k) => seal(k, Object.assign(entry, { at: Date.now() })))
      .then((b) => {
        if (this.role === 'host' && this.link === link && this.listed === sig) link.pub(topic, b, true);
      })
      .catch(() => {});
  }

  _notify() {
    if (this.o.onState) this.o.onState();
  }

  /* Ereignisse der Übergabe, für Tests und zur Fehlersuche */
  _log(what, extra) {
    if (this.o.onLog) this.o.onLog(what, Object.assign({ ep: this.ep, role: this.role }, extra || {}));
  }

  _save() {
    if (this.closed || !this.o.onSave || !this.code) return;
    this.o.onSave({ role: this.led ? 'host' : 'guest', code: this.code, ep: this.ep, snap: this.snap });
  }

  async _open(code) {
    this.code = code;
    this.link = new Link(code, {
      onMessage: (sfx, m) => this._msg(sfx, m),
      onState: (s) => {
        if (s === 'online') {
          this.echoAt = Date.now();
          if (this.role === 'host') this._dirty();
          else if (this.role === 'guest') {
            this._spare();
            if (this.view) this.link.send('up', { t: 'sync', pid: this.pid });
          }
        }
        this._notify();
      },
    });
    this.link.subscribe(['up', 'all', 'd/' + this.pid]);
    try {
      await this.link.open(brokers()[brokerIndexFor(code)]);
    } catch (e) {
      this.link.close();
      const err = new Error('Der Relay für diesen Raum ist von deinem Netz aus nicht erreichbar. Prüfe deine Verbindung oder wechsle das Netz (WLAN oder mobile Daten).');
      err.net = true;
      throw err;
    }
  }

  /* Nach einer eigenen Unterbrechung bekommt das leitende Gerät eine kurze Schonfrist. */
  _spare() {
    this.lastHost = Math.max(this.lastHost, Date.now() - (T.quiet - T.grace));
  }

  /* ---- Einstiege ---- */

  async openRoom() {
    const idx = await pickBroker();
    const code = makeCode(Math.random, PREFIX[idx % PREFIX.length]);
    await this._open(code);
    const room = new Room(code, this._hooks());
    room.join(this.pid, this.name);
    this._becomeHost(room, 1);
  }

  async join(code) {
    code = normCode(code);
    if (code.length !== 5) throw new Error('Der Raumcode hat 5 Buchstaben.');
    this.role = 'probe';
    await this._open(code);
    try {
      if (!(await this._ask(T.find))) throw new Error('Raum nicht gefunden. Stimmt der Code, und ist der Raum noch offen?');
    } catch (e) {
      this.close(false, true);
      throw e;
    }
    this._startTick();
    this._save();
  }

  /*
   * Zurück in einen Raum, in dem dieses Gerät schon war. rec: { role, code, ep, snap } aus dem Speicher.
   * Leitet inzwischen ein anderes Gerät, reihe ich mich ein. Antwortet niemand, öffne ich den Raum
   * aus meiner Sicherung wieder.
   */
  async resume(rec) {
    const code = normCode(rec && rec.code);
    const snap = rec && rec.snap && rec.snap.code === code && Array.isArray(rec.snap.players) ? rec.snap : null;
    if (!snap) return this.join(code);
    this.snap = snap;
    this.ep = snap.ep || 1;
    this.led = rec.role === 'host';
    this.role = 'probe';
    await this._open(code);
    try {
      await this._enter();
    } catch (e) {
      this.close(false, true);
      throw e;
    }
  }

  async _enter() {
    if (this.busy) return;
    this.busy = true;
    try {
      for (let round = 0; round < 3; round++) {
        const found = await this._ask(this.led ? T.probe : T.search);
        if (this.closed) return;
        if (found) {
          this.led = false;
          this._log('eingereiht', { host: this.hostPid });
          this._startTick();
          this._save();
          return;
        }
        if (this.role === 'probe' && this.led) {
          /* Niemand hat übernommen: Ich leite einfach weiter. */
          if (this._reopen(this.ep)) return;
          break;
        }
        if (this.role === 'probe' || Date.now() - this.lastHost > 3500 * K) {
          /* Niemand leitet mehr: Ich bewerbe mich mit meiner Sicherung. */
          const ep = this.ep + 1;
          const t0 = Date.now();
          if ((await this._claim(ep)) && !this.closed && this.role !== 'host' && this.ep < ep && this.lastHost < t0) {
            if (this._reopen(ep, { took: true })) return;
            break;
          }
          if (this.closed) return;
        }
      }
      throw new Error('Raum nicht gefunden. Vielleicht ist die Partie schon vorbei.');
    } finally {
      this.busy = false;
    }
  }

  /* Fragt nach dem Raum, bis ein leitendes Gerät meine Sicht schickt. false: Niemand hat geantwortet. */
  async _ask(ms) {
    const n0 = this.viewN;
    const ask = (this.asking = { nope: null });
    let t0 = 0;
    let last = 0;
    try {
      for (;;) {
        if (this.closed) return false;
        if (ask.nope) throw new Error(ask.nope);
        if (this.role === 'host') return false;
        if (this.role === 'guest' && this.viewN > n0) return true;
        const now = Date.now();
        if (this.link.state === 'online') {
          if (!t0) t0 = now;
          if (now - last >= T.ask) {
            last = now;
            this.link.send('up', { t: 'join', pid: this.pid, name: this.name });
          }
          /* Bewirbt sich gerade jemand um die Leitung, warte ich das Ergebnis ab. */
          const until = Math.max(t0 + ms, this.claimSeen ? this.claimSeen + T.claim + 900 * K : 0, this.role === 'guest' ? this.lastHost + 4000 * K : 0);
          if (now >= Math.min(until, t0 + ms + 15000 * K)) return false;
        } else {
          t0 = 0;
          last = 0;
        }
        await sleep(Math.max(20, 100 * K));
      }
    } finally {
      if (this.asking === ask) this.asking = null;
    }
  }

  /* ---- Rollenwechsel ---- */

  _becomeHost(room, ep, info) {
    this.role = 'host';
    this.led = true;
    this.paused = false;
    this.room = room;
    room.deputy = this.pid;
    room.testCfg = this.o.testCfg || null;
    this.ep = ep;
    this.hostPid = this.pid;
    this.code = room.code;
    this.view = null;
    this.viewKey = '';
    this.claiming = null;
    this.hostBye = false;
    this.leftHost = '';
    /* Unbekannt, was zuletzt in der Liste stand: beim ersten Mal auf jeden Fall melden oder austragen */
    this.listed = '?';
    this.guests = {};
    const now = Date.now();
    for (const p of room.players) if (p.pid !== this.pid) this.guests[p.pid] = { seen: now, lastId: -1, lastRes: null };
    room.setOnline(this.pid, true);
    this._log('leite', { v: room.v, took: !!(info && info.took) });
    this._startTick();
    this.echoAt = Date.now();
    this.link.send('all', { t: 'hb', ep, host: this.pid, v: room.v });
    this._dirty();
    /* Den Abschied schon jetzt verschlüsseln: Beim Wegwischen der Seite bleibt dafür keine Zeit. */
    this.byeBytes = null;
    this.link
      .pack({ t: 'bye', ep, host: this.pid, leave: false })
      .then((b) => {
        if (this.role === 'host' && this.ep === ep) this.byeBytes = b;
      })
      .catch(() => {});
    if (this.o.onRole) this.o.onRole(Object.assign({ role: 'host' }, info || {}));
    this._notify();
  }

  /* Öffnet den Raum aus der eigenen Sicherung. */
  _reopen(ep, info) {
    let room;
    try {
      room = Room.restore(JSON.parse(JSON.stringify(this.snap)), this._hooks());
    } catch (e) {
      return false;
    }
    if (!room.has(this.pid)) {
      room.destroy();
      return false;
    }
    this._becomeHost(room, ep, info);
    return true;
  }

  /* Übernahme im laufenden Betrieb: Das bisherige Leitgerät ist weg. */
  _takeOver(ep) {
    const old = this.hostPid;
    const left = this.leftHost === old;
    if (!this._reopen(ep, { took: true })) return;
    const room = this.room;
    if (old && old !== this.pid && room.has(old)) {
      if (left) room.leave(old);
      else room.setOnline(old, false);
    }
    this._dirty();
  }

  /* Ein anderes Gerät leitet mit neuerer Amtszeit: einreihen. */
  _stepDown(ep, host) {
    this._log('abgelöst', { by: host, newEp: ep });
    this.listed = '';
    clearTimeout(this.flush);
    this.flush = null;
    if (this.room) this.room.destroy();
    this.room = null;
    this.guests = {};
    this.role = 'guest';
    this.led = false;
    this.ep = ep;
    this.hostPid = host;
    this.viewKey = '';
    this.lastHost = Date.now();
    this.hostBye = false;
    this.claiming = null;
    this.link.send('up', { t: 'join', pid: this.pid, name: this.name });
    this._startTick();
    this._save();
    if (this.o.onRole) this.o.onRole({ role: 'guest', stepped: true });
    this._notify();
  }

  /*
   * Die Seite verschwindet in den Hintergrund. Ein Leitgerät gibt die Leitung ab, damit die anderen
   * nicht warten müssen: Im Hintergrund friert das Handy die Seite ein.
   */
  pause() {
    if (this.closed || this.hidden) return;
    this.hidden = true;
    this.hiddenAt = Date.now();
    if (this.role === 'host') this._resign();
  }

  _resign() {
    const room = this.room;
    if (!room || !room.players.some((p) => p.pid !== this.pid && p.online)) return; /* niemand da, der übernehmen könnte */
    const snap = JSON.parse(JSON.stringify(this._snap()));
    this.snap = snap;
    this._save();
    clearTimeout(this.flush);
    this.flush = null;
    if (this.byeBytes) this.link.sendNow('all', this.byeBytes);
    this.link.send('all', { t: 'snap', ep: this.ep, host: this.pid, snap });
    this.link.send('all', { t: 'bye', ep: this.ep, host: this.pid, leave: false });
    room.destroy();
    this.room = null;
    this.guests = {};
    this.role = 'probe';
    this.paused = true;
    this._log('abgemeldet', { v: snap.v });
    clearInterval(this.tick);
    this._notify();
  }

  /* Die Seite ist wieder sichtbar. */
  wake() {
    if (this.closed) return;
    const longGone = this.hidden && Date.now() - this.hiddenAt > 4000 * K;
    this.hidden = false;
    if (this.link) {
      /* Nach einer längeren Pause steht die Verbindung oft nur noch scheinbar. */
      if (longGone) this.link.restart();
      else this.link.kick();
    }
    if (this.paused) {
      /* Ich hatte die Leitung abgegeben: nachsehen, wer jetzt leitet. */
      this.paused = false;
      this._enter().catch((e) => {
        if (this.closed) return;
        this.close(false, true);
        if (this.o.onGone) this.o.onGone(e.message);
      });
    } else if (this.role === 'guest') {
      this._spare();
      this.boost = Date.now();
      this.link.send('up', { t: 'sync', pid: this.pid });
    }
  }

  _startTick() {
    clearInterval(this.tick);
    this.ticks = 0;
    this.tick = setInterval(() => this._tick(), T.tick);
  }

  _tick() {
    if (this.closed) return;
    this.ticks++;
    if (this.role === 'host') {
      if (this.hidden) {
        this._resign();
        if (this.role !== 'host') return;
      }
      if (this.ticks % Math.max(1, Math.round(T.hb / T.tick)) !== 0) return;
      const now = Date.now();
      /* Kommt mein eigenes Lebenszeichen nicht mehr vom Relay zurück, ist die Verbindung tot. */
      if (this.link.state === 'online' && now - this.echoAt > T.quiet) {
        this.echoAt = now;
        this.link.restart();
        return;
      }

  if (!snap) return;
  leaveSession();
  try {
    S.session = new SoloSession({ snap });
    S.session.start();
    keepAwake();
  } catch (e) {
    store.del('zs.solo');
    S.session = null;
    goHome();
  }
}

function leaveSession(leaveRoom) {
  if (S.session) {
    try {
      S.session.close(leaveRoom);
    } catch (e) {}
  }
  S.session = null;
  S.game = null;
  S.prev = null;
  S.room = null;
  S.sel = -1;
  S.pending = -1;
  S.shownRound = -1;
  S.drawnRound = -1;
  S.lastReact = 0;
  S.shownEnd = false;
  S.panelKey = '';
  S.seatKey = '';
  $('rxPal').hidden = true;
  handEls.clear();
  $('hand').innerHTML = '';
  $('trick').innerHTML = '';
  $('seats').innerHTML = '';
  $('panel').hidden = true;
  $('gNet').hidden = true;
  closeSheet();
}

function goHome() {
  leaveSession();
  renderHome();
  show('home');
}

/* ---------- eingehende Sichten ---------- */
function onView(v) {
  S.prev = S.game;
  S.game = v.game;
  S.room = v.room;
  if (S.room && S.session && S.session.kind !== 'solo') {
    const m = store.get('zs.mp', null);
    if (m && Date.now() - m.at > 20000) {
      m.at = Date.now();
      store.set('zs.mp', m);
    }
  }
  S.pending = -1;
  if (S.game) {
    if (S.screen !== 'game') {
      show('game');
      S.prev = null;
    }
    renderGame();
    autopilot();
  } else if (S.room) {
    if (S.screen === 'game') {
      closeSheet();
      handEls.clear();
      $('hand').innerHTML = '';
      $('trick').innerHTML = '';
      S.shownRound = -1;
      S.shownEnd = false;
    }
    show('mp');
    renderLobby();
  }
}

function netState() {
  if (!S.session || S.session.kind === 'solo') return;
  const st = S.session.status();
  let text = '';
  if (st.link !== 'online') text = 'Verbindung unterbrochen. Verbinde neu …';
  else if (!st.hostAlive) text = 'Das Handy, das die Partie leitet, antwortet nicht. Gleich übernimmt ein anderes.';
  const g = $('gNet');
  g.hidden = !text;
  g.textContent = text;
  const b = $('mNet');
  if (b) {
    b.hidden = !text;
    b.textContent = text;
  }
}

/* ---------- Start ---------- */
function renderHome() {
  const fan = $('fan');
  if (!fan.firstChild) {
    const ids = [E.cardId(2, 7), E.cardId(1, 10), 52, E.cardId(0, 13), E.cardId(3, 5)];
    ids.forEach((id, i) => {
      const c = el('div', 'card');
      c.innerHTML = C.cardSVG(id);
      c.style.transform = `rotate(${(i - 2) * 15}deg)`;
      c.style.animationDelay = i * 70 + 'ms';
      fan.appendChild(c);
    });
  }
  const btn = $('hResume');
  const mp = store.get('zs.mp', null);
  const solo = store.get('zs.solo', null);
  btn.hidden = true;
  if (mp && Date.now() - mp.at < 3 * 3600e3 && !inClaude()) {
    btn.hidden = false;
    btn.textContent = 'Zurück in Raum ' + mp.code;
    btn.onclick = () => resumeRoom(mp);
  } else if (solo && solo.G && solo.G.phase !== 'gameEnd' && solo.G.phase !== 'init') {
    btn.hidden = false;
    btn.textContent = `Weiterspielen (Runde ${solo.G.round} von ${solo.G.rounds})`;
    btn.onclick = resumeSolo;
  }
  $('hSolo').className = btn.hidden ? 'btn primary' : 'btn';
}

function seg(box, items, value, onPick) {
  box.innerHTML = '';
  for (const it of items) {
    const b = el('button', '', it.label);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(it.value === value));
    b.onclick = () => onPick(it.value);
    box.appendChild(b);
  }
}

function renderSolo() {
  seg(
    $('sPlayers'),
    [3, 4, 5, 6].map((n) => ({ value: n, label: String(n) })),
    settings.players,
    (v) => {
      settings.players = v;
      saveSettings();
      renderSolo();
    }
  );
  $('sRounds').textContent = `Du und ${settings.players - 1} Computergegner.`;
  const full = 60 / settings.players;
  seg(
    $('sLen'),
    [
      { value: false, label: `Voll (${full} Runden)` },
      { value: true, label: 'Kurz (8 Runden)' },
    ],
    !!settings.short,
    (v) => {
      settings.short = v;
      saveSettings();
      renderSolo();
    }
  );
  $('sLenHint').textContent = settings.short ? `Karten je Runde: ${E.shortPlan(settings.players).join(', ')}.` : `Jede Runde eine Karte mehr, von 1 bis ${full}.`;
  seg(
    $('sLevel'),
    LEVELS.map((l) => ({ value: l.id, label: l.name })),
    settings.level,
    (v) => {
      settings.level = v;
      saveSettings();
      renderSolo();
    }
  );
  $('sLevelHint').textContent = LEVELS.find((l) => l.id === settings.level).hint;
  $('sHid').setAttribute('aria-checked', String(settings.hiddenBids));
  $('sPm1').setAttribute('aria-checked', String(settings.pm1 && !settings.hiddenBids));
  $('sPm1').setAttribute('aria-disabled', String(settings.hiddenBids));
  $('sDp').setAttribute('aria-checked', String(settings.dealerPicks));
}

/* ---------- Mehrspieler: Eingang und Warteraum ---------- */
function nameField(parent) {
  const f = el('div', 'field');
  const lab = el('label', '', 'Dein Name');
  lab.htmlFor = 'mName';
  const inp = el('input');
  inp.id = 'mName';
  inp.maxLength = 14;
  inp.autocomplete = 'nickname';
  inp.autocapitalize = 'words';
  inp.spellcheck = false;
  inp.enterKeyHint = 'done';
  inp.value = settings.name;
  inp.oninput = () => {

/* ---------- Mit Freunden: Tische ---------- */

let tableWatch = null;
function stopWatch() {
  if (tableWatch) tableWatch.close();
  tableWatch = null;
}

const AV_COLORS = ['var(--glut)', 'var(--flut)', 'var(--laub)', 'var(--licht)'];
function avatar(name, bot) {
  const a = el('span', 'av' + (bot ? ' bot' : name ? '' : ' free'));
  if (name && !bot) {
    let h = 7;
    for (const ch of name.toLowerCase()) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const k = h % 4;
    a.style.background = AV_COLORS[k];
    a.style.color = k === 3 ? '#221638' : '#fff6e6';
    a.textContent = Array.from(name)[0].toUpperCase();
  }
  a.setAttribute('aria-hidden', 'true');
  return a;
}

function fmtNum(n) {
  return n.toLocaleString('de-DE');
}

/* Eine Kachel pro Tisch: oben Länge und Varianten, darunter die Plätze, unten was man tun kann. */
function tableTile(t, onJoin) {
  const b = el('button', 'ttile' + (t.open ? ' open' : ' busy'));
  b.type = 'button';
  const head = el('div', 'thead');
  const rounds = t.phase === 'game' ? t.rounds : t.short ? 8 : 60 / t.size;
  head.appendChild(el('span', 'ttag', t.short ? 'Kurz' : rounds + ' Runden'));
  if (t.hiddenBids) head.appendChild(el('span', 'ttag', 'Verdeckt'));
  b.appendChild(head);
  const ul = el('ul', 'tseats');
  for (let i = 0; i < t.size; i++) {
    const nm = t.names[i];
    const bot = !!(t.bots && t.bots[i]);
    const li = el('li', nm ? (bot ? 'bot' : '') : 'free');
    li.appendChild(avatar(nm, bot));
    li.appendChild(el('span', 'nm', nm || 'frei'));
    ul.appendChild(li);
  }
  b.appendChild(ul);
  const free = t.size - t.names.length;
  let foot;
  if (t.open) foot = 'Beitreten';
  else if (t.phase === 'lobby') foot = 'Voll, startet gleich';
  else if (t.over) foot = 'Partie vorbei';
  else foot = `Runde ${t.round} von ${t.rounds}`;
  b.appendChild(el('span', 'tfoot', foot));
  if (t.open) {
    b.setAttribute('aria-label', `Tisch von ${t.names[0]}, ${free === 1 ? 'ein Platz' : free + ' Plätze'} frei. Beitreten`);
    b.onclick = () => onJoin(t.code);
  } else {
    b.disabled = true;
    b.setAttribute('aria-label', `Tisch von ${t.names[0]}. ${foot}`);
  }
  return b;
}

function renderMpEnter(msg) {
  show('mp');
  stopWatch();
  $('mTitle').textContent = 'Mit Freunden';
  const body = $('mBody');
  body.innerHTML = '';
  if (inClaude()) {
    body.appendChild(el('p', 'banner', 'In dieser Vorschau gibt es keinen Mehrspieler. Er läuft in der Version, die du selbst hochlädst.'));
    return;
  }
  if (msg) body.appendChild(el('p', 'banner', msg));
  const inp = nameField(body);
  const needName = () => {
    if (settings.name) return true;
    toast('Gib zuerst deinen Namen ein.');
    inp.focus();
    return false;
  };

  const grid = el('div', 'tables');
  const fresh = el('button', 'ttile new');
  fresh.type = 'button';
  fresh.innerHTML = '<span class="plus" aria-hidden="true"></span><b>Neuen Tisch eröffnen</b><span class="sub">Link und QR-Code für deine Freunde</span>';
  fresh.onclick = () => needName() && hostRoom();
  const started = Date.now();
  let list = [];
  const draw = () => {
    grid.innerHTML = '';
    grid.appendChild(fresh);
    for (const t of list) grid.appendChild(tableTile(t, (code) => needName() && joinRoom(code)));
    if (!list.length) {
      const searching = Date.now() - started < 3500;
      grid.appendChild(el('div', 'ttile empty', searching ? 'Suche offene Tische …' : 'Gerade spielt sonst niemand. Eröffne einen Tisch, dann sehen ihn alle hier.'));
    }
  };
  draw();
  setTimeout(() => tableWatch && draw(), 3600);
  body.appendChild(grid);
  tableWatch = new Net.TableWatch((l) => {
    list = l;
    draw();
  });
  tableWatch.start().catch(() => {});

  const row = el('div', 'joinrow');
  const f = el('div', 'field codein');
  const lab = el('label', '', 'Mit Raumcode beitreten');
  lab.htmlFor = 'mCode';
  const code = el('input');
  code.id = 'mCode';
  code.maxLength = 5;
  code.autocapitalize = 'characters';
  code.autocomplete = 'off';
  code.spellcheck = false;
  code.placeholder = 'ABCDE';
  code.value = Net.normCode(QS.get('r') || '');
  code.oninput = () => (code.value = Net.normCode(code.value));
  const join = el('button', 'btn', 'Beitreten');
  join.onclick = () => {
    if (!needName()) return;
    if (Net.normCode(code.value).length !== 5) {
      toast('Der Raumcode hat 5 Buchstaben.');
      code.focus();
      return;
    }
    joinRoom(code.value);
  };
  code.onkeydown = (e) => e.key === 'Enter' && join.onclick();
  f.append(lab, code);
  row.append(f, join);
  body.appendChild(row);

  const stats = el('p', 'hint stats');
  stats.hidden = true;
  body.appendChild(stats);
  Promise.all([counter('get', 'partien'), counter('get', 'geraete')]).then(([games, devices]) => {
    if (!games && !devices) return;
    const parts = [];
    if (games) parts.push(`${fmtNum(games)} ${games === 1 ? 'Partie' : 'Partien'} mit Freunden`);
    if (devices) parts.push(`${fmtNum(devices)} ${devices === 1 ? 'Gerät war' : 'Geräte waren'} dabei`);
    stats.textContent = 'Bisher ' + parts.join(', ') + '.';
    stats.hidden = false;
  });
  body.appendChild(legalLinks());
}

/* Über Link oder QR-Code eingeladen, aber noch ohne Namen: nur den Namen abfragen, dann direkt an den Tisch. */
function renderInvite(code) {
  show('mp');
  $('mTitle').textContent = 'Einladung';
  const body = $('mBody');
  body.innerHTML = '';
  body.appendChild(el('p', 'lede', `Du bist an Tisch ${code} eingeladen. Wie sollen dich die anderen sehen?`));
  const inp = nameField(body);

      toast('Gib zuerst deinen Namen ein.');

    }
