function mpBusy(text) {
  show('mp');
  stopWatch();
  const body = $('mBody');
  body.innerHTML = '';
  body.appendChild(el('p', 'lede', text));
}

function sessionOptions(name) {
  return {
    pid: myPid(),
    name,
    onView,
    onState: netState,
    onGone: (text) => {
      store.del('zs.mp');
      leaveSession();
      renderMpEnter(text);
    },
    /* Stand des Raums auf diesem Gerät sichern: So kann es den Raum wieder öffnen oder die Leitung übernehmen. */
    onSave: (rec) => store.set('zs.mp', { role: rec.role, code: rec.code, name, at: Date.now(), ep: rec.ep, snap: rec.snap }),
    /* Das leitende Handy meldet den Start einer Partie mit Freunden und bekommt ihre Nummer zurück. */
    onGameStart: () => counter('hit', 'partien'),
    testCfg: DEV.rounds || DEV.speed !== undefined ? { rounds: DEV.rounds, speed: DEV.speed } : null,
  };
}

async function enterRoom(busyText, name, go, failText, keepRecord) {
  leaveSession();
  mpBusy(busyText);
  const sess = new Net.Session(sessionOptions(name));
  S.session = sess;
  try {
    await go(sess);
    keepAwake();
  } catch (e) {
    if (S.session !== sess) return;
    leaveSession();
    /* Ohne Netz bleibt die Sicherung liegen: Der Raum lässt sich später wieder öffnen. */
    if (!(keepRecord && e && e.net)) store.del('zs.mp');
    renderMpEnter((e && e.message) || failText);
  }
}

function hostRoom() {
  return enterRoom('Raum wird eröffnet …', settings.name, (sess) => sess.openRoom(), 'Der Raum konnte nicht eröffnet werden.');
}

function joinRoom(code) {
  code = Net.normCode(code);
  return enterRoom('Verbinde mit Raum ' + code + ' …', settings.name || 'Gast', (sess) => sess.join(code), 'Beitritt nicht möglich.');
}

function resumeRoom(m) {
  return enterRoom('Zurück in Raum ' + m.code + ' …', m.name || settings.name || 'Gast', (sess) => sess.resume(m), 'Der Raum ist nicht mehr erreichbar.', true);
}

function shareUrl(code) {
  return location.origin + location.pathname + '?r=' + code + (customRelay ? '&relay=' + encodeURIComponent(customRelay) : '');
}

async function shareRoom(code) {
  const url = shareUrl(code);
  const text = `Spiel mit mir ${APP}. Raumcode: ${code}`;
  try {
    if (navigator.share) {
      await navigator.share({ title: APP, text, url });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  try {
    await navigator.clipboard.writeText(url);
    toast('Link kopiert.');
  } catch (e) {
    toast(url);
  }
}

function qrSVG(text) {
  if (S.qr && S.qr.text === text) return S.qr.svg;
  let svg = '';
  try {
    const q = QR(0, 'M');
    q.addData(text);
    q.make();
    const n = q.getModuleCount();
    let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`;
    svg = `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QR-Code zum Beitreten"><path d="${d}" fill="#221638"/></svg>`;
  } catch (e) {}
  S.qr = { text, svg };
  return svg;
}

function legalLinks() {
  const p = el('p', 'hint legal');
  if (!hasLegal()) return p;
  const a = el('button', '', 'Impressum');
  a.onclick = () => openImpressum();
  const b = el('button', '', 'Datenschutz');
  b.onclick = () => openPrivacy();
  p.append(a, b);
  return p;
}

function renderLobby() {
  const r = S.room;
  if (!r) return;
  $('mTitle').textContent = 'Warteraum';
  const body = $('mBody');
  body.innerHTML = '';
  const net = el('p', 'banner');
  net.id = 'mNet';
  net.hidden = true;
  body.appendChild(net);

  const head = el('div', 'stack');
  const row = el('div', 'coderow');
  const left = el('div', 'stack');
  left.style.gap = '4px';
  left.append(el('span', 'label', 'Raumcode'), el('div', 'code', r.code));
  const qr = el('button', 'qr');
  qr.type = 'button';
  qr.innerHTML = qrSVG(shareUrl(r.code));
  qr.setAttribute('aria-label', 'QR-Code vergrößern');
  qr.onclick = () => {
    const w = el('div', 'stack');
    const big = el('div', 'qr big');
    big.innerHTML = qrSVG(shareUrl(r.code));
    w.append(big, el('p', 'lede', `Mit der Kamera scannen oder Raumcode ${r.code} eingeben.`));
    openSheet('qr', 'Beitreten', w);
  };
  row.append(left, qr);
  head.appendChild(row);
  const share = el('button', 'btn', 'Link an Freunde schicken');
  share.onclick = () => shareRoom(r.code);
  head.appendChild(share);
  body.appendChild(head);

  const list = el('ul', 'people');
  r.players.forEach((p) => {
    const li = el('li', p.online ? '' : 'off');
    li.appendChild(el('b', '', p.name));
    const tags = [];
    if (p.you) tags.push('du');
    if (p.owner) tags.push('hat eröffnet');
    if (!p.online) tags.push('nicht verbunden');
    li.appendChild(el('span', 'tag', tags.join(', ')));
    list.appendChild(li);
  });
  const lvl = LEVELS.find((l) => l.id === r.cfg.level) || LEVELS[1];
  for (let i = r.players.length; i < r.cfg.size; i++) {
    const li = el('li', 'bot');
    li.appendChild(el('b', '', 'Computer'));
    li.appendChild(el('span', 'tag', lvl.name));
    list.appendChild(li);
  }
  const who = el('div', 'stack');
  who.append(el('span', 'label', `Am Tisch: ${r.cfg.size} Plätze`), list);
  body.appendChild(who);

  const relay = el('p', 'hint', 'Verbunden über ' + Net.relayName(r.code) + '.');
  if (r.owner) {
    const start = el('button', 'btn primary', `Partie starten (${r.cfg.short ? 8 : 60 / r.cfg.size} Runden)`);
    start.onclick = async () => {
      start.disabled = true;
      const res = await S.session.send({ t: 'start' });
      if (res.error) {
        toast(res.error);
        start.disabled = false;
      }
    };
    body.appendChild(start);
    const f1 = el('div', 'field');
    f1.appendChild(el('span', 'label', 'Plätze am Tisch'));
    const s1 = el('div', 'seg');
    seg(
      s1,
      [3, 4, 5, 6].filter((n) => n >= r.players.length).map((n) => ({ value: n, label: String(n) })),
      r.cfg.size,
      (v) => S.session.send({ t: 'cfg', size: v })
    );
    f1.append(s1, el('span', 'hint', 'Freie Plätze übernimmt der Computer.'));
    body.appendChild(f1);
    if (r.cfg.size > r.players.length) {
      const f2 = el('div', 'field');
      f2.appendChild(el('span', 'label', 'Stärke der Computergegner'));
      const s2 = el('div', 'seg');
      seg(
        s2,
        LEVELS.map((l) => ({ value: l.id, label: l.name })),
        r.cfg.level,
        (v) => S.session.send({ t: 'cfg', level: v })
      );
      f2.appendChild(s2);
      body.appendChild(f2);
    }
    const f3 = el('div', 'field');
    f3.appendChild(el('span', 'label', 'Länge der Partie'));
    const s3 = el('div', 'seg');
    seg(
      s3,
      [
        { value: false, label: `Voll (${60 / r.cfg.size} Runden)` },
        { value: true, label: 'Kurz (8 Runden)' },
      ],
      !!r.cfg.short,
      (v) => S.session.send({ t: 'cfg', short: v })
    );
    f3.appendChild(s3);
    body.appendChild(f3);
    body.appendChild(switchRow('Verdeckte Ansage', 'Alle wählen gleichzeitig und geheim. Aufgedeckt wird, wenn jeder angesagt hat.', !!r.cfg.hiddenBids, (v) => S.session.send({ t: 'cfg', hiddenBids: v })));
    const sw = el('button', 'switch');
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', String(r.cfg.pm1 && !r.cfg.hiddenBids));
    sw.setAttribute('aria-disabled', String(!!r.cfg.hiddenBids));
    sw.innerHTML = '<span><b>Variante Plus/Minus 1</b><span>Die Ansagen dürfen zusammen nicht genau aufgehen.</span></span><span class="knob"></span>';
    sw.onclick = () => (r.cfg.hiddenBids ? toast('Plus/Minus 1 geht nicht zusammen mit verdeckter Ansage.') : S.session.send({ t: 'cfg', pm1: !r.cfg.pm1 }));
    body.appendChild(sw);
    body.appendChild(
      switchRow('Geber wählt den Trumpf', 'Gilt, wenn ein Zauberer aufgedeckt wird (Originalregel). Ausgeschaltet wird die Trumpffarbe dann ausgelost.', !!r.cfg.dealerPicks, (v) => S.session.send({ t: 'cfg', dealerPicks: v }))
    );
    body.appendChild(
      switchRow('Offener Tisch', 'Alle sehen ihn unter „Mit Freunden“ und können sich setzen. Aus: nur mit Link, QR-Code oder Raumcode.', r.cfg.open !== false, (v) => S.session.send({ t: 'cfg', open: v }))
    );
    body.appendChild(el('p', 'hint', 'Legt jemand sein Handy weg, läuft die Partie auf den anderen weiter.'));
    body.appendChild(relay);
  } else {
    const ow = r.players.find((p) => p.boss && p.online) || r.players.find((p) => p.owner);
    body.appendChild(el('p', 'lede', `Warte, bis ${ow ? ow.name : 'der Eröffner'} die Partie startet.`));
    body.appendChild(el('p', 'hint', `${r.cfg.size} Plätze, ${r.cfg.short ? '8 Runden (kurze Partie)' : 60 / r.cfg.size + ' Runden'}${r.cfg.hiddenBids ? ', verdeckte Ansage' : ''}${r.cfg.pm1 ? ', Variante Plus/Minus 1' : ''}${r.cfg.dealerPicks ? ', Geber wählt den Trumpf bei aufgedecktem Zauberer' : ''}${r.cfg.open === false ? ', privater Tisch' : ''}.`));
    body.appendChild(relay);
  }
  body.appendChild(legalLinks());
  netState();
}

/* ---------- Spieltisch ---------- */
let L = { W: 390, cw: 66, ch: 94, sw: 86 };
function computeLayout() {
  const W = $('hand').clientWidth || $('app').clientWidth || 390;
  const cw = Math.max(46, Math.min(88, Math.floor((W - 22) / 5.55)));
  const sw = Math.round(Math.max(62, Math.min(92, W * 0.222)));
  L = { W, cw, ch: Math.round(cw * 1.42), sw };
  const st = $('game').style;
  st.setProperty('--cw', cw + 'px');
  st.setProperty('--sw', sw + 'px');
}

function sortHand(hand, trump) {
  const key = (c) => {
    if (c >= 56) return 9000 + c;
    if (c >= 52) return c - 100;
    const s = (c / 13) | 0;
    const r = c % 13;
    const order = s === trump ? 0 : s + 1;
    return order * 100 + (12 - r);
  };
  return hand.slice().sort((a, b) => key(a) - key(b));
}

function handLayout(n) {
  const rows = n > 10 ? 2 : 1;
  const per = rows === 1 ? n : Math.ceil(n / 2);
  const avail = L.W - 20;
  const rowGap = Math.round(L.ch * 0.58);
  const top = 20;
  const pos = [];
  for (let r = 0; r < rows; r++) {
    const cnt = r === 0 ? per : n - per;
    const step = cnt > 1 ? Math.min(L.cw + 6, (avail - L.cw) / (cnt - 1)) : 0;
    const x0 = (L.W - (L.cw + (cnt - 1) * step)) / 2;
    for (let i = 0; i < cnt; i++) pos.push({ x: Math.round(x0 + i * step), y: top + r * rowGap, z: 10 + r * 30 + i });
  }
  return { pos, height: top + L.ch + (rows - 1) * rowGap + 10 };
}

const KINDS = { 2: ['t', 't'], 3: ['l', 't', 'r'], 4: ['l', 't', 't', 'r'], 5: ['l', 't', 't', 't', 'r'] };
function geometry(g) {
  const tb = $('table');
  const W = tb.clientWidth;
  const H = tb.clientHeight;
  const n = g.n;
  const me = g.me < 0 ? 0 : g.me;
  const kinds = KINDS[n - 1];
  const tw = L.cw;
  const th = L.ch;
  const s = tw + 2;
  const sh = 60;
  const top = [];
  let left = -1;
  let right = -1;
  for (let k = 1; k < n; k++) {
    const seat = (me + k) % n;
    const kd = kinds[k - 1];
    if (kd === 't') top.push(seat);
    else if (kd === 'l') left = seat;
    else right = seat;
  }
  const yTop = 10 + sh / 2;
  const bandTop = yTop + sh / 2 + 14;
  const bandBot = H - 8;
  let y1;
  let y2;
  if (bandBot - bandTop >= 2 * th + 8) {
    const mid = (bandTop + bandBot) / 2;
    y1 = mid - th / 2 - 4;
    y2 = mid + th / 2 + 4;
  } else {
    y1 = bandTop + th / 2;
    y2 = Math.max(y1 + th * 0.35, bandBot - th / 2);
  }
  const cx = W / 2;
  const seats = {};
  const slots = {};
  const m = top.length;
  top.forEach((seat, j) => {
    seats[seat] = { x: (W * (j + 1)) / (m + 1), y: yTop };
    slots[seat] = { x: cx + (j - (m - 1) / 2) * s, y: y1, z: 1 + j };
  });
  const ySide = Math.min(H - sh / 2 - 6, Math.max(yTop + sh + 12, (y1 + y2) / 2 - 14));
  if (left >= 0) {
    seats[left] = { x: 6 + L.sw / 2, y: ySide };
    slots[left] = { x: cx - s, y: y2, z: 10 };
  }
  if (right >= 0) {
    seats[right] = { x: W - 6 - L.sw / 2, y: ySide };
    slots[right] = { x: cx + s, y: y2, z: 12 };
  }
  seats[me] = { x: cx, y: H + 70 };
  slots[me] = { x: cx, y: y2, z: 11 };
  return { W, H, seats, slots, tw, th };
}

function makeCard(id) {
  const b = el('button', 'card');
  b.type = 'button';
  b.dataset.c = id;
  b.innerHTML = C.cardSVG(id);
  b.setAttribute('aria-label', C.cardName(id));
  return b;
}

function tallyHTML(bid, tricks, thinking, maxDots) {
  if (bid === null || bid === undefined) return thinking ? '<span class="wait">überlegt</span>' : '';
  if (Math.max(bid, tricks) > (maxDots || 4)) return `<span>${tricks}/${bid}</span>`;
  if (bid === 0 && tricks === 0) return '<span class="zero">0</span>';
  let s = '';
  const m = Math.max(bid, tricks);
  for (let i = 0; i < m; i++) s += `<i class="dot${i < bid ? (i < tricks ? ' won' : '') : ' over'}"></i>`;
  return s;
}

const nameOf = (g, i) => (i === g.me ? 'Du' : g.seats[i].name);

function statusText(g) {
  const me = g.me;
  if (g.phase === 'trump') return g.turn === me ? 'Wähle die Trumpffarbe' : `${nameOf(g, g.dealer)} wählt die Trumpffarbe`;
  if (g.phase === 'bid' && g.hiddenBids) {
    if (g.seats[me] && g.seats[me].bid === null) return 'Deine verdeckte Ansage';
    const open = g.seats.filter((s) => !s.bidDone).length;
    return open === 1 ? 'Warte auf die letzte Ansage' : `Warte auf ${open} Ansagen`;
  }
  if (g.phase === 'bid') return g.turn === me ? 'Deine Ansage' : `${nameOf(g, g.turn)} sagt an`;
  if (g.phase === 'play') {
    if (g.turn !== me) return `${nameOf(g, g.turn)} ist dran`;
    const cards = g.trick.plays.map((p) => p.card);
    if (!cards.length) return 'Du spielst aus';
    const ls = E.leadSuit(cards);
    if (ls >= 0 && g.hand.some((c) => E.suitOf(c) === ls)) return `Du bist dran: ${C.SUITS[ls].name} bedienen`;
    return 'Du bist dran';
  }
  if (g.phase === 'trickEnd') return g.trick.winner === me ? 'Der Stich geht an dich' : `Der Stich geht an ${nameOf(g, g.trick.winner)}`;
  if (g.phase === 'roundEnd') return 'Runde beendet';
  if (g.phase === 'gameEnd') return 'Partie beendet';
  return '';
}

function renderGame() {
  const g = S.game;
  if (!g) return;
  const p = S.prev && S.prev.n === g.n ? S.prev : null;
  computeLayout();
  const hand = sortHand(g.hand, g.trumpSuit);
  const hl = handLayout(hand.length);
  const hBox = $('hand');
  const newH = hl.height + 'px';
  if (hBox.style.height !== newH) hBox.style.height = newH;

  $('gRound').textContent = `Runde ${g.round} von ${g.rounds}`;
  const nr = S.room && S.room.nr;
  $('gNo').hidden = !nr;
  if (nr) {
    $('gNo').textContent = 'Nr. ' + fmtNum(nr);
    $('gNo').title = `Partie Nr. ${fmtNum(nr)} mit Freunden, über alle Tische gezählt`;
  }
  const bids = g.seats.map((s) => s.bid).filter((b) => b !== null);
  const sum = bids.reduce((a, b) => a + b, 0);
  const nTricks = g.cards || g.round;
  const tw = nTricks === 1 ? 'Stich' : 'Stiche';
  const hiddenNow = g.hiddenBids && g.phase === 'bid';
  $('gSub').textContent = hiddenNow ? `${nTricks} ${tw}, verdeckte Ansage` : bids.length === 0 ? `${nTricks} ${tw} zu vergeben` : `${bids.length < g.n ? 'Bisher angesagt' : 'Angesagt'}: ${sum} von ${nTricks}`;
  renderTrump(g);
  if (S.drawnRound !== g.round) {
    S.drawnRound = g.round;
    const fresh = g.trickNo === 0 && g.trick.plays.length === 0 && bids.length === 0;
    if (fresh && g.phase === 'bid' && g.trumpCard >= 0 && E.isWizard(g.trumpCard) && !g.dealerPicks && g.trumpSuit >= 0) {
      toast(`Zauberer aufgedeckt. Trumpf ausgelost: ${C.SUITS[g.trumpSuit].name}`);
    }
  }

  const G = geometry(g);
  renderSeats(g, p, G);
  if (S.room && S.room.reacts) {
    for (const rc of S.room.reacts) {
      if (rc.id > (S.lastReact || 0)) {
        S.lastReact = rc.id;
        if (rc.age < 5000) showReaction(g, rc.seat, rc.k);
      }
    }
  }
  renderTrick(g, p, G);
  renderHand(g, p, hand, hl);
  renderMeBar(g);
  renderPanel(g);
  renderSheets(g);
  netState();
}

function renderTrump(g) {
  const b = $('gTrump');
  let html;
  if (g.phase === 'trump') html = '<span class="sw"></span><span><small>Trumpf</small>wird gewählt</span>';
  else if (g.trumpSuit >= 0) {
    const su = C.SUITS[g.trumpSuit];
    html = `<span class="sw" style="background:${su.bg};color:${su.fg}">${C.glyphSVG(g.trumpSuit)}</span><span><small>Trumpf</small>${su.name}</span>`;
  } else html = '<span class="sw"></span><span><small>Trumpf</small>keiner</span>';
  if (b._k !== html) {
    b.innerHTML = html;
    b._k = html;
  }
}

function renderSeats(g, p, G) {
  const box = $('seats');
  const key = g.n + ':' + g.me;
  if (S.seatKey !== key) {
    box.innerHTML = '';
    S.seatKey = key;
    for (let k = 1; k < g.n; k++) {
      const i = (g.me + k) % g.n;
      const s = el('div', 'seat');
      s.dataset.seat = i;
      s.innerHTML = '<div class="nm"></div><div class="row"><span class="tally"></span><span class="pts"></span></div>';
      box.appendChild(s);
    }
  }
  for (const s of box.children) {
    const i = +s.dataset.seat;
    const d = g.seats[i];
    const pos = G.seats[i];
    s.style.left = pos.x + 'px';
    s.style.top = pos.y + 'px';
    const away = d.kind === 'human' && (d.online === false || d.away);
    s.classList.toggle('turn', g.turn === i);
    s.classList.toggle('away', away && !d.auto);
    s.querySelector('.nm').textContent = d.name + (d.kind === 'human' && d.auto ? ' (Computer)' : '');
    const th = g.hiddenBids && g.phase === 'bid' ? `<span class="wait">${d.bidDone ? 'angesagt' : 'überlegt'}</span>` : tallyHTML(d.bid, d.tricks, g.phase === 'bid' && g.turn === i);
    const t = s.querySelector('.tally');
    if (t._k !== th) {
      t.innerHTML = th;
      t._k = th;
    }
    s.querySelector('.pts').textContent = d.score;
    let badge = s.querySelector('.badge');
    if (g.dealer === i && !badge) {
      badge = el('span', 'badge', 'G');
      badge.title = 'Geber';
      s.appendChild(badge);
    } else if (g.dealer !== i && badge) badge.remove();
    if (p && p.round === g.round && p.seats[i].bid === null && d.bid !== null) {
      const old = s.querySelector('.bubble');
      if (old) old.remove();
      const bub = el('span', 'bubble', 'sagt ' + d.bid);
      s.appendChild(bub);
      setTimeout(() => bub.remove(), 2200);
    }
  }
}

/* ---------- Reaktionen ---------- */
function showReaction(g, seat, k) {
  const label = REACTIONS[k];
  if (!label) return;
  const word = /^[A-Za-zÄÖÜäöü]/.test(label);
  const b = el('span', 'bubble ' + (word ? 'word' : 'emo'), label);
  let host;
  if (seat === g.me) {
    host = $('table');
    b.classList.add('self');
  } else host = $('seats').querySelector(`.seat[data-seat="${seat}"]`);
  if (!host) return;
  for (const old of Array.from(host.children)) if (old.classList.contains('emo') || old.classList.contains('word')) old.remove();
  host.appendChild(b);
  setTimeout(() => b.remove(), 2900);
}

function toggleReactions(force) {
  const pal = $('rxPal');
  const open = force === undefined ? pal.hidden : force;
  if (!open) {
    pal.hidden = true;
    return;
  }
  if (!pal.firstChild) {
    REACTIONS.forEach((label, k) => {
      const b = el('button', /^[A-Za-zÄÖÜäöü]/.test(label) ? '' : 'emo', label);
      b.type = 'button';
      b.onclick = () => {
        pal.hidden = true;
        act({ t: 'react', k });
      };
      pal.appendChild(b);
    });
  }
  pal.hidden = false;
}

function centerOf(r) {
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function renderTrick(g, p, G) {
  const box = $('trick');
  const plays = g.trick.plays;
  const want = new Set(plays.map((pl) => pl.card));
  const anim = !REDUCED && document.visibilityState === 'visible';
  const tb = $('table').getBoundingClientRect();

  /* Karten des vorigen Stichs wandern zum Gewinner */
  const stale = Array.from(box.children).filter((c) => !c._leaving && !want.has(+c.dataset.c));
  if (stale.length) {
    let w = -1;
    if (p && p.trick && p.trick.winner >= 0) w = p.trick.winner;
    else if (g.lastTrick) w = g.lastTrick.winner;
    const target = w >= 0 ? G.seats[w] : null;
    for (const c of stale) {
      c._leaving = true;
      if (!anim || !target) {
        c.remove();
        continue;
      }
      const from = centerOf(c.getBoundingClientRect());
      const dx = tb.left + target.x - from.x;
      const dy = tb.top + Math.min(target.y, G.H + 40) - from.y;
      const a = c.animate([{ transform: c.style.transform, opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) ${c.style.transform} scale(0.35)`, opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' });
      a.onfinish = () => c.remove();
      setTimeout(() => c.remove(), 600);
    }
  }

  plays.forEach((pl) => {
    let c = null;
    for (const x of box.children) if (!x._leaving && +x.dataset.c === pl.card) c = x;
    const slot = G.slots[pl.seat];
    const rot = ((pl.card * 37) % 5) - 2;
    const tf = `translate(${Math.round(slot.x - G.tw / 2)}px, ${Math.round(slot.y - G.th / 2)}px) rotate(${rot}deg)`;
    if (!c) {
      let from = null;
      let scale = 0.4;
      const hEl = pl.seat === g.me ? handEls.get(pl.card) : null;
      if (hEl) {
        from = centerOf(hEl.getBoundingClientRect());
        scale = 1;
        hEl.remove();
        handEls.delete(pl.card);
      } else if (pl.seat !== g.me && G.seats[pl.seat]) {
        from = { x: tb.left + G.seats[pl.seat].x, y: tb.top + G.seats[pl.seat].y };
      }
      c = makeCard(pl.card);
      c.tabIndex = -1;
      c.style.transform = tf;
      box.appendChild(c);
      if (anim && from) {
        const to = centerOf(c.getBoundingClientRect());
        c.animate([{ transform: `translate(${from.x - to.x}px, ${from.y - to.y}px) ${tf} scale(${scale})`, opacity: scale === 1 ? 1 : 0.3 }, { transform: tf, opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
    } else if (c.style.transform !== tf) c.style.transform = tf;
    c.style.zIndex = slot.z;
    const ended = g.phase === 'trickEnd';
    c.classList.toggle('win', ended && g.trick.winner === pl.seat);
    c.classList.toggle('dim', ended && g.trick.winner !== pl.seat);
  });
}

function renderHand(g, p, hand, hl) {
  const box = $('hand');
  const want = new Set(hand);
  for (const [c, node] of handEls) {
    if (!want.has(c)) {
      node.remove();
      handEls.delete(c);
    }
  }
  if (S.sel >= 0 && !want.has(S.sel)) S.sel = -1;
  const dealt = !p || p.round !== g.round;
  const anim = !REDUCED && document.visibilityState === 'visible';
  const myTurn = g.phase === 'play' && g.turn === g.me;
  const legal = new Set(g.legal);
  hand.forEach((c, i) => {
    const pos = hl.pos[i];
    let node = handEls.get(c);
    const lift = S.sel === c ? -16 : 0;
    const tf = `translate(${pos.x}px, ${pos.y + lift}px)`;
    if (!node) {
      node = makeCard(c);
      handEls.set(c, node);
      node.style.transform = tf;
      box.appendChild(node);
      if (dealt && anim) node.animate([{ transform: `translate(${pos.x}px, ${pos.y + 46}px)`, opacity: 0 }, { transform: tf, opacity: 1 }], { duration: 340, delay: i * 38, fill: 'backwards', easing: 'cubic-bezier(.2,.8,.2,1)' });
    } else if (node.style.transform !== tf) node.style.transform = tf;
    node.style.zIndex = pos.z;
    node.classList.toggle('off', myTurn && !legal.has(c));
    node.classList.toggle('sel', S.sel === c);
    node.classList.toggle('pending', S.pending === c);
  });
}

function renderMeBar(g) {
  const bar = $('mebar');
  const me = g.seats[g.me] || g.seats[0];
  const mine = (g.turn === g.me && (g.phase === 'play' || g.phase === 'bid' || g.phase === 'trump')) || (g.hiddenBids && g.phase === 'bid' && me.bid === null);
  bar.classList.toggle('turn', !!mine);
  const html =
    `<span class="st">${esc(statusText(g))}</span>` +
    (g.dealer === g.me ? '<span class="badge gb" title="Geber">G</span>' : '') +
    `<span class="tally">${tallyHTML(me.bid, me.tricks, false, 7)}</span>` +
    `<span class="pts">${me.score}</span>` +
    (S.room ? `<button class="rx" type="button" aria-label="Reaktion senden">${ICON.smile}</button>` : '');
  if (bar._k !== html) {
    bar.innerHTML = html;
    bar._k = html;
  }
}

function renderPanel(g) {
  const panel = $('panel');
  const myBid = g.seats[g.me] ? g.seats[g.me].bid : null;
  const mine = g.phase === 'bid' && g.hiddenBids ? myBid === null : g.turn === g.me;
  const key = mine && (g.phase === 'bid' || g.phase === 'trump') ? g.round + ':' + g.phase : '';
  if (key === S.panelKey) return;
  S.panelKey = key;
  panel.innerHTML = '';
  panel.hidden = !key;
  if (!key) return;
  if (g.phase === 'trump') {
    panel.appendChild(el('h2', '', 'Du wählst den Trumpf'));
    panel.appendChild(el('p', 'hint', 'Ein Zauberer wurde aufgedeckt. Als Geber bestimmst du die Trumpffarbe.'));
    const grid = el('div', 'suitpick');
    C.SUITS.forEach((su, s) => {
      const b = el('button');
      b.type = 'button';
      b.style.background = su.bg;
      b.style.color = su.fg;
      b.innerHTML = C.glyphSVG(s) + `<span>${su.name}</span>`;
      b.onclick = () => act({ t: 'trump', s });
      grid.appendChild(b);
    });
    panel.appendChild(grid);
    return;
  }
  const r = g.cards || g.round;
  const bids = g.seats.map((s) => s.bid).filter((b) => b !== null);
  const sum = bids.reduce((a, b) => a + b, 0);
  panel.appendChild(el('h2', '', 'Wie viele Stiche machst du?'));
  let hint = bids.length ? `Bisher angesagt: ${sum} von ${r}.` : `Du sagst als Erster an. Es gibt ${r} ${r === 1 ? 'Stich' : 'Stiche'}.`;
  if (g.hiddenBids) hint = `Es gibt ${r} ${r === 1 ? 'Stich' : 'Stiche'}. Alle wählen geheim, aufgedeckt wird am Schluss.`;
  if (g.noBid >= 0) hint += ` Die ${g.noBid} ist für dich gesperrt (Plus/Minus 1).`;
  panel.appendChild(el('p', 'hint', hint));
  const chips = el('div', 'chips');
  const go = el('button', 'btn primary', 'Ansage wählen');
  go.disabled = true;
  let pick = -1;
  for (let n = 0; n <= r; n++) {
    const b = el('button', 'chip', String(n));
    b.type = 'button';
    b.disabled = n === g.noBid;
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      pick = n;
      for (const x of chips.children) x.setAttribute('aria-pressed', String(x === b));
      go.disabled = false;
      go.textContent = n === 1 ? '1 Stich ansagen' : `${n} Stiche ansagen`;
    };
    chips.appendChild(b);
  }
  go.onclick = () => {
    if (pick < 0) return;
    go.disabled = true;
    act({ t: 'bid', n: pick });
  };
  panel.append(chips, go);
}

async function act(msg) {
  if (!S.session) return;
  const res = await S.session.send(msg);
  if (res && res.error) {
    toast(res.error);
    S.pending = -1;
    S.panelKey = '';
    if (S.game) renderGame();
  }
}

function onHandTap(ev) {
  const node = ev.target.closest('.card');
  const g = S.game;
  if (!node || !g) return;
  const c = +node.dataset.c;
  const myTurn = g.phase === 'play' && g.turn === g.me;
  if (!myTurn) {
    S.sel = S.sel === c ? -1 : c;
    renderGame();
    return;
  }
  if (S.pending >= 0) return;
  if (g.legal.indexOf(c) < 0) {
    const ls = E.leadSuit(g.trick.plays.map((p) => p.card));
    toast(ls >= 0 ? `Du musst ${C.SUITS[ls].name} bedienen.` : 'Diese Karte geht gerade nicht.');
    node.classList.remove('nope');
    void node.offsetWidth;
    node.classList.add('nope');
    return;
  }
  if (settings.oneTap || S.sel === c) {
    S.sel = -1;
    S.pending = c;
    act({ t: 'play', c });
    if (S.game === g) renderGame();
  } else {
    S.sel = c;
    renderGame();
  }
}

/* ---------- Blätter ---------- */
function openSheet(type, title, content, opts) {
  opts = opts || {};
  const sh = $('sheet');
  sh.innerHTML = '';
  const body = el('div', 'sheetbody');
  const head = el('div', 'sheethead');
  head.appendChild(el('h2', '', title));
  if (!opts.sticky) {
    const x = el('button', 'iconbtn');
    x.innerHTML = ICON.close;
    x.setAttribute('aria-label', 'Schließen');
    x.onclick = () => (opts.back ? opts.back() : closeSheet());
    head.appendChild(x);
  }
  const sc = el('div', 'scroll');
  sc.style.minHeight = '0';
  sc.appendChild(content);
  body.append(head, sc);
  if (opts.footer) body.appendChild(opts.footer);
  sh.appendChild(body);
  sh.hidden = false;
  sh.onclick = (ev) => {
    if (ev.target === sh && !opts.sticky) (opts.back || closeSheet)();
  };
  S.sheet = { type };
}

function closeSheet() {
  $('sheet').hidden = true;
  $('sheet').innerHTML = '';
  S.sheet = null;
}

function resultsList(g, h) {
  const order = g.seats.map((_, i) => i).sort((a, b) => h.totals[b] - h.totals[a]);
  const ul = el('ul', 'results');
  for (const i of order) {
    const li = el('li', i === g.me ? 'me' : '');
    li.appendChild(el('span', 'nm', nameOf(g, i)));
    const d = h.deltas[i];
    li.appendChild(el('span', 'dl ' + (d > 0 ? 'good' : 'bad'), (d > 0 ? '+' : '−') + Math.abs(d)));
    li.appendChild(el('span', 'tt', String(h.totals[i])));
    li.appendChild(el('span', 'sub', `${h.bids[i]} angesagt, ${h.tricks[i]} gemacht`));
    ul.appendChild(li);
  }
  return ul;
}

function roundFooter(g) {
  const foot = el('div', 'stack');
  const me = g.seats[g.me];
  const last = g.round >= g.rounds;
  const waiting = g.seats.filter((s, i) => s.kind === 'human' && i !== g.me && !s.ready && !s.auto && s.online !== false && !s.away).map((s) => s.name);
  const b = el('button', 'btn primary', me && me.ready ? (waiting.length ? 'Warte auf ' + waiting.join(', ') : 'Gleich geht es weiter') : last ? 'Endstand ansehen' : 'Nächste Runde');
  b.disabled = !!(me && me.ready);
  b.onclick = () => {
    b.disabled = true;
    act({ t: 'ready' });
  };
  const blk = el('button', 'btn plain', 'Block ansehen');
  blk.onclick = () => openBlock(() => openRoundEnd(S.game));
  foot.append(b, blk);
  return foot;
}

function openRoundEnd(g) {
  if (!g || g.phase !== 'roundEnd') {
    closeSheet();
    return;
  }
  const h = g.history[g.history.length - 1];
  openSheet('round', `Runde ${h.round} gewertet`, resultsList(g, h), { sticky: true, footer: roundFooter(g) });
}

function openGameEnd(g) {
  const h = g.history[g.history.length - 1];
  const wn = g.winners.map((i) => nameOf(g, i));
  const iWon = g.winners.indexOf(g.me) >= 0;
  const title = iWon ? (wn.length > 1 ? 'Geteilter Sieg für dich' : 'Du gewinnst die Partie') : wn.length > 1 ? `${wn.slice(0, -1).join(', ')} und ${wn[wn.length - 1]} teilen sich den Sieg` : `${wn[0]} gewinnt die Partie`;
  const order = g.seats.map((_, i) => i).sort((a, b) => g.seats[b].score - g.seats[a].score);
  const ul = el('ul', 'results');
  order.forEach((i) => {
    const li = el('li', i === g.me ? 'me' : '');
    li.appendChild(el('span', 'nm', nameOf(g, i)));
    li.appendChild(el('span', 'dl', ''));
    li.appendChild(el('span', 'tt', String(g.seats[i].score)));
    const hits = g.history.filter((x) => x.bids[i] === x.tricks[i]).length;
    li.appendChild(el('span', 'sub', `${hits} von ${g.history.length} Ansagen getroffen`));
    ul.appendChild(li);
  });
  const foot = el('div', 'stack');
  const solo = S.session && S.session.kind === 'solo';
  if (solo) {
    store.del('zs.solo');
    const again = el('button', 'btn primary', 'Neue Partie');
    again.onclick = startSolo;
    foot.appendChild(again);
  } else if (S.room && S.room.owner) {
    const again = el('button', 'btn primary', 'Zurück in den Warteraum');
    again.onclick = () => act({ t: 'again' });
    foot.appendChild(again);
  } else {
    foot.appendChild(el('p', 'hint', 'Wer den Raum eröffnet hat, kann eine neue Partie starten.'));
  }
  const blk = el('button', 'btn plain', 'Block ansehen');
  blk.onclick = () => openBlock(() => openGameEnd(S.game));
  const home = el('button', 'btn plain', solo ? 'Zum Start' : 'Raum verlassen');
  home.onclick = () => {
    if (!solo) store.del('zs.mp');
    leaveSession(true);
    goHome();
  };
  foot.append(blk, home);
  void h;
  let content = ul;
  if (!solo && S.room && S.room.nr) {
    content = el('div', 'stack');
    content.append(el('p', 'hint', `Das war Partie Nr. ${fmtNum(S.room.nr)} mit Freunden, über alle Tische gezählt.`), ul);
  }
  openSheet('end', title, content, { sticky: true, footer: foot });
}

function renderSheets(g) {
  if (g.phase === 'roundEnd') {
    if (S.shownRound !== g.round) {
      S.shownRound = g.round;
      openRoundEnd(g);
    } else if (S.sheet && S.sheet.type === 'round') openRoundEnd(g);
  } else if (S.sheet && S.sheet.type === 'round') closeSheet();
  if (g.phase === 'gameEnd') {
    if (!S.shownEnd) {
      S.shownEnd = true;
      openGameEnd(g);
    }
  } else {
    if (S.sheet && S.sheet.type === 'end') closeSheet();
    S.shownEnd = false;
  }
}

function openBlock(back) {
  const g = S.game;
  if (!g) return;
  const wrap = el('div');
  const tbl = el('table', 'block');
  const thead = el('tr');
  thead.appendChild(el('th', '', ''));
  g.seats.forEach((s, i) => thead.appendChild(el('th', '', nameOf(g, i))));
  tbl.appendChild(thead);
  for (const h of g.history) {
    const tr = el('tr');
    const td0 = el('td');
    const rs = el('span', 'rs', String(h.cards || h.round));
    if (h.trumpSuit >= 0) {
      rs.style.background = C.SUITS[h.trumpSuit].bg;
      rs.style.color = C.SUITS[h.trumpSuit].fg;
    }
    td0.appendChild(rs);
    tr.appendChild(td0);
    g.seats.forEach((s, i) => {
      const td = el('td', h.bids[i] === h.tricks[i] ? 'hit' : '');
      td.appendChild(el('b', '', String(h.totals[i])));
      td.appendChild(el('small', '', `${h.tricks[i]} von ${h.bids[i]}`));
      tr.appendChild(td);
    });
    tbl.appendChild(tr);
  }
  wrap.appendChild(tbl);
  wrap.appendChild(el('p', 'hint', g.history.length ? 'Links: Karten in der Runde, eingefärbt in der Trumpffarbe. Fett: Punktestand nach der Runde. Darunter: gemachte Stiche von angesagten, grün bei Treffer.' : 'Noch keine Runde gewertet.'));
  wrap.lastChild.style.marginTop = '10px';
  openSheet('block', 'Block', wrap, { back });
}

function openRules(back) {
  const node = $('rulesTpl').content.cloneNode(true);
  const leg = node.querySelector('#legend');
  const items = [
    [E.cardId(0, 13), 'Glut', 'rot, Feuer'],
    [E.cardId(1, 8), 'Flut', 'blau, Wellen'],
    [E.cardId(2, 5), 'Laub', 'grün, Blätter'],
    [E.cardId(3, 2), 'Licht', 'gelb, Strahlen'],
    [52, 'Zauberer', 'gewinnt immer'],
    [56, 'Narr', 'gewinnt nie'],
    [-1, 'Rückseite', ''],
  ];
  for (const [id, name, sub] of items) {
    const f = el('figure');
    const c = el('div', 'card');
    c.innerHTML = id >= 0 ? C.cardSVG(id) : C.backSVG();
    const cap = el('figcaption');
    cap.appendChild(el('b', '', name));
    cap.appendChild(document.createTextNode(sub));
    f.append(c, cap);
    leg.appendChild(f);
  }
  const wrap = el('div');
  wrap.appendChild(node);
  openSheet('rules', 'Regeln und Karten', wrap, { back });
}

function openTrumpInfo() {
  const g = S.game;
  if (!g) return;
  const wrap = el('div', 'stack');
  let text;
  if (g.trumpCard < 0) text = 'In der letzten Runde sind alle Karten verteilt. Es gibt keinen Trumpf.';
  else if (E.isJester(g.trumpCard)) text = 'Ein Narr wurde aufgedeckt. In dieser Runde gibt es keinen Trumpf.';
  else if (E.isWizard(g.trumpCard)) {
    if (g.phase === 'trump') text = `Ein Zauberer wurde aufgedeckt. ${nameOf(g, g.dealer)} wählt als Geber die Trumpffarbe.`;
    else if (g.dealerPicks) text = `Ein Zauberer wurde aufgedeckt. ${nameOf(g, g.dealer)} hat als Geber ${C.SUITS[g.trumpSuit].name} zum Trumpf gemacht.`;
    else text = `Ein Zauberer wurde aufgedeckt. Die Trumpffarbe wurde ausgelost: ${C.SUITS[g.trumpSuit].name}.`;
  }
  else text = `Aufgedeckt wurde ${C.cardName(g.trumpCard)}. ${C.SUITS[g.trumpSuit].name} ist Trumpf und sticht jede andere Farbe.`;
  if (g.trumpCard >= 0) {
    const row = el('div', 'minirow');
    const c = el('div', 'card');
    c.style.setProperty('--cw', '96px');
    c.innerHTML = C.cardSVG(g.trumpCard);
    row.appendChild(c);
    wrap.appendChild(row);
  }
  wrap.appendChild(el('p', '', text));
  openSheet('trump', 'Trumpf', wrap);
}

function openLastTrick() {
  const g = S.game;
  const wrap = el('div', 'stack');
  if (!g || !g.lastTrick) wrap.appendChild(el('p', 'hint', 'In dieser Runde wurde noch kein Stich gemacht.'));
  else {
    const row = el('div', 'minirow');
    g.lastTrick.plays.forEach((pl) => {
      const f = el('figure');
      f.style.margin = '0';
      const c = el('div', 'card');
      c.innerHTML = C.cardSVG(pl.card);
      const cap = el('figcaption', 'hint', nameOf(g, pl.seat));
      if (pl.seat === g.lastTrick.winner) cap.style.fontWeight = '700';
      f.append(c, cap);
      row.appendChild(f);
    });
    wrap.appendChild(row);
    wrap.appendChild(el('p', '', `Der Stich ging an ${g.lastTrick.winner === g.me ? 'dich' : nameOf(g, g.lastTrick.winner)}.`));
  }
  openSheet('last', 'Letzter Stich', wrap, { back: openMenu });
}

/* ---------- Impressum und Datenschutz ---------- */
function hasLegal() {
  return !!(LEGAL && LEGAL.name && LEGAL.street && LEGAL.city && LEGAL.email);
}

function openImpressum(back) {
  const w = el('div', 'legaltext');
  w.innerHTML =
    `<section><h3>Angaben gemäß § 5 DDG</h3><p>${esc(LEGAL.name)}<br>${esc(LEGAL.street)}<br>${esc(LEGAL.city)}</p></section>` +
    `<section><h3>Kontakt</h3><p>E-Mail: ${esc(LEGAL.email)}${LEGAL.phone ? '<br>Telefon: ' + esc(LEGAL.phone) : ''}</p></section>` +
    `<section><h3>Verantwortlich für den Inhalt</h3><p>${esc(LEGAL.name)}, Anschrift wie oben</p></section>` +
    `<p class="hint">${APP} ist ein privates Projekt ohne Werbung und ohne Gewinnabsicht.</p>`;
  openSheet('imp', 'Impressum', w, { back });
}

function openPrivacy(back) {
  const w = el('div', 'legaltext');
  w.innerHTML =
    `<section><h3>Kurz gesagt</h3><p>${APP} braucht kein Konto, zeigt keine Werbung, setzt keine Cookies und legt keine Nutzerprofile an. Verarbeitet wird, was nötig ist, um die Seite auszuliefern und Partien zwischen Geräten zu vermitteln. Dazu kommen zwei Zähler ohne Namen: wie viele Partien mit Freunden gespielt wurden und wie viele Geräte dabei waren.</p></section>` +
    `<section><h3>Verantwortlich</h3><p>${esc(LEGAL.name)}, ${esc(LEGAL.street)}, ${esc(LEGAL.city)}, E-Mail: ${esc(LEGAL.email)}</p></section>` +

    `<section><h3>Speicher auf deinem Gerät</h3><p>Die App legt im Browser deines Geräts ab: deinen Spielernamen, deine Einstellungen, eine zufällige Gerätekennung für Räume und den Stand laufender Partien. Diese Daten bleiben auf deinem Gerät und dienen nur der Funktion der App. Du löschst sie über die Website-Daten in den Einstellungen deines Browsers. Der Zugriff ist für den von dir gewünschten Dienst unbedingt erforderlich (§ 25 Abs. 2 Nr. 2 TDDDG).</p></section>` +
    `<section><h3>Mit Freunden spielen</h3><p>In einem Raum werden Spielernamen, Spielzüge, Karten und Reaktionen zwischen den beteiligten Geräten übertragen. Das Gerät, das die Partie leitet, verarbeitet diese Daten. Damit die Partie einen Ausfall übersteht, erhalten auch die Geräte der anderen Mitspieler eine Sicherung des Spielstands.</p><p>Die Vermittlung läuft über öffentliche MQTT-Relays Dritter (broker.emqx.io, broker.hivemq.com, mqtt.eclipseprojects.io, test.mosquitto.org). Deren Betreiber sehen dabei deine IP-Adresse und können außerhalb der EU sitzen. Die Inhalte sind mit einem Schlüssel aus dem Raumcode verschlüsselt (AES-GCM). Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, weil die Übertragung für die von dir gewählte Funktion nötig ist. Im Solo-Modus findet keine solche Übertragung statt.</p></section>` +
    `<section><h3>Offene Tische</h3><p>Ein Tisch ist zunächst offen. Dann sehen alle, die unter „Mit Freunden“ die Liste der Tische öffnen, den Raumcode, die Namen am Tisch, die Einstellungen und während der Partie die Runde, und sie können sich an freie Plätze setzen. Diese Angaben laufen ebenfalls über die genannten Relays. Wer den Raum eröffnet hat, kann den Tisch im Warteraum privat schalten; dann erscheint er nicht in der Liste. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO.</p></section>` +
    `<section><h3>Zähler</h3><p>Die App nutzt den kostenlosen Zähldienst Abacus (abacus.jasoncameron.dev), den eine Privatperson betreibt und dessen Server außerhalb der EU liegen können. Er wird in drei Fällen aufgerufen: wenn ein Gerät zum ersten Mal mit Freunden spielt, wenn das leitende Gerät eine Partie mit mindestens zwei Spielern startet, und wenn du die Seite „Mit Freunden“ öffnest, um die Zählerstände anzuzeigen. Übertragen wird nur der Aufruf selbst, ohne Namen, Spieldaten oder Kennung. Der Dienst sieht dabei technisch bedingt deine IP-Adresse. Auf deinem Gerät wird dafür nichts zusätzlich gespeichert. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO, das berechtigte Interesse, die Nutzung der App in groben Zahlen zu kennen. Du kannst widersprechen, indem du die App nicht mit Freunden nutzt; im Solo-Modus wird nichts gezählt.</p></section>` +
    `<section><h3>Keine weitere Auswertung</h3><p>Außer den beiden Zählern gibt es keine Analyse-Werkzeuge, keine Werbung und keine eingebundenen sozialen Netzwerke. Der Betreiber erhält keine Spieldaten und führt keine Nutzerprofile.</p></section>` +
    `<section><h3>Deine Rechte</h3><p>Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch sowie das Recht, dich bei einer Datenschutz-Aufsichtsbehörde zu beschweren. Der Betreiber speichert selbst keine Daten über einzelne Spieler. Anfragen richtest du an die oben genannte Adresse.</p></section>` +
    `<p class="hint">Stand: November 2026</p>`;
  openSheet('ds', 'Datenschutz', w, { back });
}

function switchRow(title, sub, on, onToggle) {
  const sw = el('button', 'switch');
  sw.setAttribute('role', 'switch');
  sw.setAttribute('aria-checked', String(on));
  sw.innerHTML = `<span><b>${esc(title)}</b><span>${esc(sub)}</span></span><span class="knob"></span>`;
  sw.onclick = () => {
    on = !on;
    sw.setAttribute('aria-checked', String(on));
    onToggle(on);
  };
  return sw;
}

function openMenu() {
  const g = S.game;
  const menu = el('div', 'menu');
  const add = (label, fn, cls) => {
    const b = el('button', 'btn ' + (cls || 'plain'), label);
    b.onclick = fn;
    menu.appendChild(b);
    return b;
  };
  add('Block ansehen', () => openBlock(openMenu));
  add('Letzter Stich', openLastTrick);
  add('Regeln und Karten', () => openRules(openMenu));
  menu.appendChild(
    switchRow('Karte mit einem Tipp spielen', 'Sonst hebst du die Karte erst an und tippst noch einmal.', settings.oneTap, (v) => {
      settings.oneTap = v;
      saveSettings();
    })
  );
  const solo = S.session && S.session.kind === 'solo';
  if (solo) {
    menu.appendChild(
      switchRow('Schnelles Tempo', 'Die Computergegner spielen zügiger.', settings.fast, (v) => {
        settings.fast = v;
        saveSettings();
        S.session.host.setSpeed(v ? 0.55 : 1);
      })
    );
  } else if (S.room && S.room.owner && g) {
    g.seats.forEach((s, i) => {
      if (s.kind !== 'human' || i === g.me) return;
      if (s.online === false || s.auto) {
        add(s.auto ? `${s.name} spielt wieder selbst` : `Computer spielt für ${s.name}`, () => {
          act({ t: 'auto', seat: i, on: !s.auto });
          closeSheet();
        });
      }
    });
    add('Partie abbrechen, zurück in den Warteraum', () => {
      closeSheet();
      act({ t: 'end' });
    });
  }
  if (hasLegal()) {
    add('Impressum', () => openImpressum(openMenu));
    add('Datenschutz', () => openPrivacy(openMenu));
  }
  if (S.room) menu.appendChild(el('p', 'hint', `Raumcode ${S.room.code}` + (S.room.nr ? `, Partie Nr. ${fmtNum(S.room.nr)} über alle Tische` : '') + (S.session && S.session.role === 'host' ? '. Dieses Handy leitet gerade die Partie.' : '.')));
  add(solo ? 'Zum Start (Partie bleibt gespeichert)' : 'Raum verlassen', () => {
    if (!solo) store.del('zs.mp');
    leaveSession(true);
    goHome();
  });
  openSheet('menu', 'Menü', menu);
}

/* ---------- Testhilfe: spielt die eigenen Züge automatisch (?auto=1) ---------- */
function autopilot() {
  if (!S.auto) return;
  clearTimeout(autopilot.t);
  autopilot.t = setTimeout(() => {
    const g = S.game;
    if (!g || !S.session || !S.auto) return;
    const me = g.me;
    if (g.phase === 'trump' && g.turn === me) S.session.send({ t: 'trump', s: 1 });
    else if (g.phase === 'bid' && (g.turn === me || (g.hiddenBids && g.seats[me].bid === null))) {
      let b = Math.min(g.cards || g.round, Math.round(g.hand.length / g.n));
      if (b === g.noBid) b = b ? b - 1 : 1;
      S.session.send({ t: 'bid', n: b });
    } else if (g.phase === 'play' && g.turn === me && g.legal.length) S.session.send({ t: 'play', c: g.legal[0] });
    else if (g.phase === 'roundEnd' && !g.seats[me].ready && !S.autoHold) S.session.send({ t: 'ready' });
  }, 60);
}

/* ---------- Start der App ---------- */
function init() {
  for (const b of document.querySelectorAll('[data-back]')) {
    b.innerHTML = ICON.back;
    b.onclick = goHome;
  }
  $('mBack').innerHTML = ICON.back;
  $('mBack').onclick = () => {
    if (S.session && S.session.kind !== 'solo') {
      store.del('zs.mp');
      leaveSession(true);
    }
    goHome();
  };
  $('gMenu').innerHTML = ICON.menu;
  $('gMenu').onclick = openMenu;
  $('gTrump').onclick = openTrumpInfo;
  $('hSolo').onclick = () => {
    renderSolo();
    show('solo');
  };
  $('hFriends').onclick = () => renderMpEnter(S.mpMsg);
  $('hRules').onclick = () => openRules();
  $('sPm1').onclick = () => {
    if (settings.hiddenBids) {
      toast('Plus/Minus 1 geht nicht zusammen mit verdeckter Ansage.');
      return;
    }
    settings.pm1 = !settings.pm1;
    saveSettings();
    renderSolo();
  };
  $('sHid').onclick = () => {
    settings.hiddenBids = !settings.hiddenBids;
    if (settings.hiddenBids) settings.pm1 = false;
    saveSettings();
    renderSolo();
  };
  $('sDp').onclick = () => {
    settings.dealerPicks = !settings.dealerPicks;
    saveSettings();
    renderSolo();
  };
  $('sStart').onclick = startSolo;
  $('hVer').textContent = 'Version ' + VERSION;
  $('hImp').hidden = $('hDs').hidden = !hasLegal();
  $('hImp').onclick = () => openImpressum();
  $('hDs').onclick = () => openPrivacy();
  $('mebar').addEventListener('click', (ev) => {
    if (ev.target.closest('.rx')) toggleReactions();
  });
  document.addEventListener('click', (ev) => {
    if (!$('rxPal').hidden && !ev.target.closest('.rxpal') && !ev.target.closest('.rx')) toggleReactions(false);
  });
  $('hand').addEventListener('click', onHandTap);
  window.addEventListener('resize', () => {
    if (S.game && S.screen === 'game') {
      S.prev = S.game;
      renderGame();
    }
  });
  /* Im Hintergrund friert das Handy die Seite ein: Leitung abgeben, beim Zurückkommen wieder einreihen. */
  const away = () => S.session && S.session.pause && S.session.pause();
  window.addEventListener('pagehide', away);
  window.addEventListener('pageshow', (ev) => {
    if (ev.persisted && S.session && S.session.wake) S.session.wake();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') {
      away();
      return;
    }
    if (S.session && S.session.wake) S.session.wake();
    if (S.game) {
      keepAwake();
      S.prev = S.game;
      renderGame();
    }
  });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  setInterval(netState, 3000);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !inClaude()) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  renderHome();
  show('home');
  const mp = store.get('zs.mp', null);
  const code = Net.normCode(QS.get('r') || '');
  if (code) {
    /* Den Code aus der Adresse nehmen, damit ein späteres Neuladen nicht wieder an diesen Tisch führt. */
    const q = new URLSearchParams(location.search);
    q.delete('r');
    try {
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
    } catch (e) {}
  }
  if (!inClaude() && mp && Date.now() - mp.at < 30 * 60e3 && (!code || code === mp.code)) resumeRoom(mp);
  else if (code.length === 5 && !inClaude()) {
    if (settings.name) joinRoom(code);
    else renderInvite(code);
  } else if (QS.get('solo') === '1') startSolo();
  window.__zs = { S, settings, store, poke: autopilot };
}

init();

return module.exports;})(__req);
})();
