:root {
  /* Layout: Der Tisch füllt die Mitte, die eigene Hand liegt unten. Texte stehen linksbündig.
     Farbe tragen nur die Karten, alles andere bleibt ruhig in Tinte und Papier. */
  --table: #e7e4ee;
  --surface: #f6f4fa;
  --raised: #ffffff;
  --ink: #221638;
  --ink2: #5f5679;
  --line: #cfc9dd;
  --veil: rgba(34, 22, 56, 0.5);
  --good: #157a55;
  --bad: #c93a26;
  --glut: #e4502e;
  --flut: #2757c9;
  --laub: #157a55;
  --licht: #f5b920;
  --cream: #fff6e6;
  --card-ink: #221638;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --lift: 0 1px 2px rgba(34, 22, 56, 0.22), 0 6px 16px rgba(34, 22, 56, 0.14);
  --edge: rgba(20, 12, 36, 0.38);
  --cw: 66px;
  --sw: 86px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --table: #1b1430;
    --surface: #261c44;
    --raised: #32265c;
    --ink: #f1eef8;
    --ink2: #aca3c6;
    --line: #43366e;
    --veil: rgba(8, 5, 18, 0.66);
    --good: #4ccb96;
    --bad: #ff8a73;
    --lift: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.4);
    --edge: rgba(255, 255, 255, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --table: #1b1430;
  --surface: #261c44;
  --raised: #32265c;
  --ink: #f1eef8;
  --ink2: #aca3c6;
  --line: #43366e;
  --veil: rgba(8, 5, 18, 0.66);
  --good: #4ccb96;
  --bad: #ff8a73;
  --lift: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.4);
  --edge: rgba(255, 255, 255, 0.3);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  touch-action: manipulation;
}
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--table);
  color: var(--ink);
  font: 15px/1.4 var(--body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  touch-action: manipulation;
  cursor: pointer;
}
h1,
h2,
h3,
p {
  margin: 0;
}
[hidden] {
  display: none !important;
}

#app {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.scroll {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* ---------- Karten ---------- */
.card {
  display: block;
  padding: 0;
  border: 0;
  background: none;
  width: var(--cw);
  height: calc(var(--cw) * 1.42);
  border-radius: calc(var(--cw) * 0.1);
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--edge), 0 2px 5px rgba(20, 12, 36, 0.28);
  flex: none;
}
.cardsvg {
  display: block;
  width: 100%;
  height: 100%;
}
.cardsvg text {
  font-family: var(--display);
  font-weight: 800;
}

/* ---------- Bausteine ---------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 54px;
  padding: 6px 18px;
  border-radius: 15px;
  border: 2px solid var(--ink);
  background: transparent;
  font: 800 23px/1.05 var(--display);
  letter-spacing: 0.2px;
  text-align: center;
}
.btn.primary {
  background: var(--ink);
  color: var(--table);
}
.btn.plain {
  min-height: 46px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 600 15px/1.2 var(--body);
  letter-spacing: 0;
}
.btn:disabled {
  opacity: 0.42;
  cursor: default;
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
}
:focus-visible {
  outline: 3px solid var(--flut);
  outline-offset: 2px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label,
.label {
  font: 800 18px/1 var(--display);
}
.field input {
  height: 50px;
  padding: 0 14px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--raised);
  font-size: 17px;
  -webkit-user-select: text;
  user-select: text;
  width: 100%;
}
.field input:focus {
  outline: none;
  border-color: var(--ink);
}
.hint {
  color: var(--ink2);
  font-size: 13px;
}
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 6px;
}
.seg button {
  min-height: 46px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 800 20px/1 var(--display);
}
.seg button[aria-pressed='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--table);
}
.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  padding: 10px 0;
  border: 0;
  background: none;
  text-align: left;
}
.switch .knob {
  flex: none;
  width: 50px;
  height: 30px;
  border-radius: 15px;
  background: var(--line);
  position: relative;
  transition: background 0.15s;
}
.switch .knob::after {
  content: '';
  position: absolute;
  left: 3px;
  top: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--raised);
  transition: transform 0.15s;
}
.switch[aria-checked='true'] .knob {
  background: var(--ink);
}
.switch[aria-checked='true'] .knob::after {
  transform: translateX(20px);
  background: var(--table);
}
.switch b {
  display: block;
  font: 800 19px/1.1 var(--display);
}
.switch span span {
  display: block;
  color: var(--ink2);
  font-size: 13px;
  margin-top: 2px;
}

/* ---------- Start ---------- */
.home {
  padding: 14px 20px 22px;
  gap: 16px;
}
.fan {
  position: relative;
  height: 196px;
  flex: none;
}
.fan .card {
  position: absolute;
  left: 50%;
  top: 22px;
  --cw: 100px;
  margin-left: -50px;
  transform-origin: 50% 135%;
  animation: fanIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
@keyframes fanIn {
  from {
    transform: rotate(0deg) translateY(30px);
    opacity: 0;
  }
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 800 60px/0.9 var(--display);
  letter-spacing: -0.5px;
}
.lede {
  color: var(--ink2);
  font-size: 16px;
  max-width: 32ch;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.grow {
  flex: 1;
  min-height: 0;
}

/* ---------- Unterseiten (Solo-Einstellungen, Mehrspieler) ---------- */
.page {
  padding: 8px 20px 22px;
  gap: 18px;
}
.pagehead {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 50px;
  margin: 0 -8px;
}
.pagehead h1 {
  font: 800 30px/1 var(--display);
}
.iconbtn {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--surface);
}
.iconbtn svg {
  width: 22px;
  height: 22px;
}
.code {
  font: 800 64px/1 var(--display);
  letter-spacing: 6px;
  -webkit-user-select: text;
  user-select: text;
}
.codein input {
  font: 800 30px/1 var(--display);
  letter-spacing: 6px;
  text-transform: uppercase;
  height: 58px;
}
.people {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.people li {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  padding: 0 14px;
  border-radius: 13px;
  background: var(--surface);
  border: 1.5px solid var(--line);
}
.people li b {
  font: 800 21px/1 var(--display);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.people li .tag {
  font-size: 12px;
  color: var(--ink2);
}
.people li.bot {
  border-style: dashed;
  background: transparent;
}
.people li.off b {
  opacity: 0.5;
}
.banner {
  padding: 10px 14px;
  border-radius: 13px;
  border: 1.5px solid var(--bad);
  color: var(--bad);
  font-size: 14px;
  font-weight: 600;
}

/* ---------- Spieltisch ---------- */
.top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px 4px;
  min-height: 54px;
  flex: none;
}
.topmid {
  flex: 1;
  min-width: 0;
}
.topmid b {
  display: block;
  font: 800 22px/1 var(--display);
  white-space: nowrap;
}
.topmid span {
  display: block;
  font-size: 12px;
  line-height: 1.2;
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.trump {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 12px 0 7px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 800 19px/1 var(--display);
  white-space: nowrap;
  flex: none;
}
.trump .sw {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--line);
}
.trump .sw svg {
  width: 20px;
  height: 20px;
}
.trump small {
  display: block;
  font: 600 10.5px/1 var(--body);
  color: var(--ink2);
  margin-bottom: 2px;
}
.net {
  margin: 0 10px 2px;
  padding: 7px 12px;
  border-radius: 11px;
  background: var(--bad);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  flex: none;
}
.table {
  position: relative;
  flex: 1;
  min-height: 0;
}
.seat {
  position: absolute;
  width: var(--sw);
  height: 60px;
  margin: -30px 0 0 calc(var(--sw) / -2);
  padding: 7px 9px 6px;
  border-radius: 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
}
.seat.turn {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px var(--line);
}
.seat.away {
  opacity: 0.55;
}
.seat .nm {
  font: 800 18px/1 var(--display);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.seat .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 16px;
}
.pts {
  font: 800 16px/1 var(--display);
  color: var(--ink2);
}
.tally {
  display: flex;
  align-items: center;
  gap: 3px;
  font: 800 16px/1 var(--display);
  min-height: 12px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.7px solid var(--ink);
  flex: none;
}
.dot.won {
  background: var(--ink);
}
.dot.over {
  background: var(--bad);
  border-color: var(--bad);
}
.tally .zero {
  font: 800 15px/1 var(--display);
}
.tally .wait {
  color: var(--ink2);
  font: 600 11px/1 var(--body);
}
.badge {
  position: absolute;
  top: -9px;
  right: -7px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--table);
  font: 800 13px/20px var(--display);
}
.bubble {
  position: absolute;
  left: 50%;
  top: 100%;
  margin-top: 7px;
  transform: translateX(-50%);
  padding: 7px 11px;
  border-radius: 11px;
  background: var(--ink);
  color: var(--table);
  font: 800 19px/1 var(--display);
  white-space: nowrap;
  pointer-events: none;
  z-index: 6;
  animation: pop 2.1s ease forwards;
}
@keyframes pop {
  0% {
    opacity: 0;
    transform: translateX(-50%) scale(0.6);
  }
  8% {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  82% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}
#trick .card {
  position: absolute;
  left: 0;
  top: 0;
  cursor: default;
  transition: filter 0.25s, box-shadow 0.25s;
}
#trick .card.dim {
  filter: brightness(0.72) saturate(0.7);
}
#trick .card.win {
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--table), 0 8px 18px rgba(20, 12, 36, 0.4);
  z-index: 30 !important;
}

.mebar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 10px;
  padding: 8px 12px;
  min-height: 44px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  flex: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.mebar .st {
  flex: 1;
  min-width: 0;
  font: 800 20px/1.05 var(--display);
}
.mebar.turn {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--table);
}
.mebar.turn .dot {
  border-color: var(--table);
}
.mebar.turn .dot.won {
  background: var(--table);
}
.mebar.turn .dot.over {
  border-color: var(--bad);
}
.mebar.turn .pts {
  color: var(--table);
}
.mebar .gb {
  position: static;
  flex: none;
}
.mebar.turn .gb {
  background: var(--table);
  color: var(--ink);
}
.hand {
  position: relative;
  flex: none;
  height: 124px;
  transition: height 0.25s;
}
.hand .card {
  position: absolute;
  left: 0;
  top: 0;
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.2s, opacity 0.2s;
}
.hand .card.off {
  filter: brightness(0.74) saturate(0.45);
}
.hand .card.sel {
  box-shadow: 0 0 0 2.5px var(--ink), 0 0 0 5px var(--table), 0 8px 16px rgba(20, 12, 36, 0.4);
}
.hand .card.pending {
  opacity: 0.55;
}
.hand .card.nope {
  animation: nope 0.3s;
}
@keyframes nope {
  25% {
    margin-left: -5px;
  }
  75% {
    margin-left: 5px;
  }
}

/* ---------- Ansage / Trumpfwahl ---------- */
.panel {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 8px;
  z-index: 40;
  padding: 14px;
  border-radius: 18px;
  border: 2px solid var(--ink);
  background: var(--raised);
  box-shadow: var(--lift);
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: rise 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes rise {
  from {
    transform: translateY(16px);
    opacity: 0;
  }
}
.panel h2 {
  font: 800 25px/1 var(--display);
}
.chips {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.chip {
  height: 44px;
  border-radius: 11px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font: 800 22px/1 var(--display);
  padding: 0;
}
.chip[aria-pressed='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--table);
}
.chip:disabled {
  opacity: 0.32;
  text-decoration: line-through;
}
.suitpick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.suitpick button {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 56px;
  padding: 0 14px;
  border: 0;
  border-radius: 13px;
  font: 800 24px/1 var(--display);
}
.suitpick svg {
  width: 26px;
  height: 26px;
}

/* ---------- Blätter (Rundenende, Block, Regeln, Menü) ---------- */
.sheet {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: var(--veil);
  animation: fade 0.2s;
}
@keyframes fade {
  from {
    opacity: 0;
  }
}
.sheetbody {
  max-height: 94%;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheethead {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sheethead h2 {
  flex: 1;
  font: 800 30px/1 var(--display);
}
.results {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.results li {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 4px 12px;
  padding: 9px 14px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--raised);
}
.results li.me {
  border-color: var(--ink);
}
.results .nm {
  font: 800 22px/1 var(--display);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.results .sub {
  grid-column: 1;
  font-size: 12.5px;
  color: var(--ink2);
}
.results .dl {
  grid-row: 1 / span 2;
  grid-column: 2;
  font: 800 22px/1 var(--display);
  padding: 6px 9px;
  border-radius: 9px;
  min-width: 52px;
  text-align: center;
}
.results .dl.good {
  background: var(--good);
  color: #fff;
}
.results .dl.bad {
  color: var(--bad);
  border: 1.5px solid var(--bad);
}
.results .tt {
  grid-row: 1 / span 2;
  grid-column: 3;
  font: 800 28px/1 var(--display);
  min-width: 52px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.block {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.block th {
  position: sticky;
  top: 0;
  background: var(--surface);
  font: 800 16px/1.1 var(--display);
  padding: 6px 3px;
  text-align: right;
  max-width: 62px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border-bottom: 2px solid var(--ink);
}
.block th:first-child,
.block td:first-child {
  text-align: left;
  width: 34px;
}
.block td {
  padding: 5px 3px;
  text-align: right;
  border-bottom: 1px solid var(--line);
  line-height: 1.1;
}
.block td b {
  display: block;
  font: 800 19px/1 var(--display);
}
.block td small {
  font-size: 11px;
  color: var(--ink2);
}
.block td.hit small {
  color: var(--good);
  font-weight: 700;
}
.block td .rs {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  font: 800 15px/1 var(--display);
  background: var(--line);
}
.block td .rs svg {
  width: 13px;
  height: 13px;
}
.menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rules {
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-user-select: text;
  user-select: text;
}
.rules h3 {
  font: 800 22px/1.1 var(--display);
  margin-bottom: 4px;
}
.rules p,
.rules li {
  font-size: 15px;
  line-height: 1.45;
  max-width: 62ch;
}
.rules ul {
  margin: 0;
  padding-left: 18px;
}
.legend {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.legend figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12.5px;
  line-height: 1.25;
  color: var(--ink2);
}
.legend .card {
  --cw: 100%;
  width: 100%;
  height: auto;
  aspect-ratio: 100 / 142;
  border-radius: 8px;
}
.legend b {
  display: block;
  color: var(--ink);
  font: 800 18px/1 var(--display);
}
.minirow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.minirow .card {
  --cw: 58px;
}
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(200px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 80;
  max-width: 86%;
  padding: 11px 16px;
  border-radius: 13px;
  background: var(--ink);
  color: var(--table);
  font-size: 14.5px;
  font-weight: 600;
  text-align: center;
  box-shadow: var(--lift);
  animation: rise 0.2s;
}

@media (max-height: 620px) {
  .fan {
    height: 150px;
  }
  .fan .card {
    --cw: 76px;
    margin-left: -38px;
    top: 16px;
  }
  .wordmark {
    font-size: 50px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen home scroll">
    <div class="fan" id="fan" aria-hidden="true"></div>
    <h1 class="wordmark">Zauberstich</h1>
    <p class="lede">Sag an, wie viele Stiche du machst. Punkte gibt es nur, wenn du genau triffst.</p>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn primary" id="hResume" hidden>Weiterspielen</button>
      <button class="btn primary" id="hSolo">Allein gegen den Computer</button>
      <button class="btn" id="hFriends">Mit Freunden spielen</button>
      <button class="btn plain" id="hRules">Regeln und Karten</button>
    </div>
  </section>

  <section id="solo" class="screen page scroll" hidden>
    <div class="pagehead">
      <button class="iconbtn" data-back aria-label="Zurück"></button>
      <h1>Allein spielen</h1>
    </div>
    <div class="field">
      <span class="label" id="sPlayersL">Spieler am Tisch</span>
      <div class="seg" id="sPlayers" role="group" aria-labelledby="sPlayersL"></div>
      <span class="hint" id="sRounds"></span>
    </div>
    <div class="field">
      <span class="label" id="sLevelL">Stärke der Computergegner</span>
      <div class="seg" id="sLevel" role="group" aria-labelledby="sLevelL"></div>
      <span class="hint" id="sLevelHint"></span>
    </div>
    <button class="switch" id="sPm1" role="switch" aria-checked="false">
      <span><b>Variante Plus/Minus 1</b><span>Die Ansagen dürfen zusammen nicht genau aufgehen. Wer zuletzt ansagt, muss ausweichen.</span></span>
      <span class="knob"></span>
    </button>
    <div class="grow"></div>
    <button class="btn primary" id="sStart">Partie starten</button>
  </section>

  <section id="mp" class="screen page scroll" hidden>
    <div class="pagehead">
      <button class="iconbtn" id="mBack" aria-label="Zurück"></button>
      <h1 id="mTitle">Mit Freunden</h1>
    </div>
    <div id="mBody" class="stack" style="gap:18px;flex:1;min-height:0"></div>
  </section>

  <section id="game" class="screen" hidden>
    <header class="top">
      <button class="iconbtn" id="gMenu" aria-label="Menü"></button>
      <div class="topmid"><b id="gRound"></b><span id="gSub"></span></div>
      <button class="trump" id="gTrump"></button>
    </header>
    <div class="net" id="gNet" hidden role="status"></div>
    <div class="table" id="table">
      <div id="seats"></div>
      <div id="trick"></div>
      <div class="panel" id="panel" hidden></div>
    </div>
    <div class="mebar" id="mebar" aria-live="polite"></div>
    <div class="hand" id="hand"></div>
  </section>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden role="status"></div>
</div>

<template id="rulesTpl">
  <div class="rules">
    <section>
      <h3>Die Karten</h3>
      <p>60 Karten: die Werte 1 bis 13 in vier Farben, dazu 4 Zauberer und 4 Narren. Den Wert einer Karte siehst du auch am Bild: Je höher die Karte, desto größer das Feuer, desto höher das Wasser, desto mehr Blätter und Strahlen.</p>
    </section>
    <div class="legend" id="legend"></div>
    <section>
      <h3>Runden</h3>
      <p>In Runde 1 bekommt jeder eine Karte, in Runde 2 zwei, und so weiter. Zu dritt sind es 20 Runden, zu viert 15, zu fünft 12, zu sechst 10.</p>
    </section>
    <section>
      <h3>Trumpf</h3>
      <p>Nach dem Geben wird die nächste Karte aufgedeckt. Ihre Farbe ist Trumpf. Liegt ein Narr auf, gibt es keinen Trumpf. Liegt ein Zauberer auf, wählt der Geber die Trumpffarbe. In der letzten Runde sind alle Karten verteilt, dann gibt es ebenfalls keinen Trumpf.</p>
    </section>
    <section>
      <h3>Ansagen</h3>
      <p>Reihum, beginnend links vom Geber, sagt jeder an, wie viele Stiche er in dieser Runde macht. Null ist erlaubt.</p>
    </section>
    <section>
      <h3>Spielen</h3>
      <ul>
        <li>Wer links vom Geber sitzt, spielt aus. Danach spielt immer aus, wer den letzten Stich gewonnen hat.</li>
        <li>Die angespielte Farbe musst du bedienen. Hast du sie nicht, spielst du eine beliebige Karte.</li>
        <li>Zauberer und Narr darfst du immer spielen, auch wenn du bedienen könntest.</li>
        <li>Liegt ein Zauberer als erste Karte, ist die Kartenwahl für alle frei. Liegt ein Narr als erste Karte, bestimmt die nächste Zahlenkarte die Farbe.</li>
      </ul>
    </section>
    <section>
      <h3>Wer den Stich bekommt</h3>
      <ul>
        <li>Der erste Zauberer im Stich gewinnt immer.</li>
        <li>Ohne Zauberer gewinnt der höchste Trumpf.</li>
        <li>Ohne Trumpf gewinnt die höchste Karte der angespielten Farbe.</li>
        <li>Ein Narr gewinnt nie. Liegen nur Narren, gewinnt der erste.</li>
      </ul>
    </section>
    <section>
      <h3>Wertung</h3>
      <p>Ansage genau getroffen: 20 Punkte plus 10 für jeden Stich. Daneben gelegen: 10 Minuspunkte für jeden Stich zu viel oder zu wenig. Nach der letzten Runde gewinnt, wer die meisten Punkte hat.</p>
    </section>
    <section>
      <h3>Anzeige am Tisch</h3>
      <p>Die Kreise neben einem Namen zeigen die Ansage. Ein gefüllter Kreis ist ein gewonnener Stich, ein leerer fehlt noch, ein roter ist einer zu viel. Der Geber trägt ein G.</p>
    </section>
    <section>
      <h3>Variante Plus/Minus 1</h3>

    body.appendChild(el('p', 'hint', 'Dein Handy leitet die Partie. Lass diese Seite offen, bis ihr fertig seid.'));
    body.appendChild(relay);
  } else {
    const ow = r.players.find((p) => p.owner);
    body.appendChild(el('p', 'lede', `Warte, bis ${ow ? ow.name : 'der Eröffner'} die Partie startet.`));
    body.appendChild(el('p', 'hint', `${r.cfg.size} Plätze, ${60 / r.cfg.size} Runden${r.cfg.pm1 ? ', Variante Plus/Minus 1' : ''}.`));
    body.appendChild(relay);
  }
  netState();
}

/* ---------- Spieltisch ---------- */
let L = { W: 390, cw: 66, ch: 94, sw: 86 };
function computeLayout() {
  const W = $('hand').clientWidth || $('app').clientWidth || 390;
  const cw = Math.max(46, Math.min(88, Math.floor((W - 22) / 5.55)));
  const sw = Math.round(Math.max(62, Math.min(92, W * 0.222)));
  L = { W, cw, ch: Math.round(cw * 1.42), sw };
  const st = $('game').style;
  st.setProperty('--cw', cw + 'px');
  st.setProperty('--sw', sw + 'px');
}

function sortHand(hand, trump) {
  const key = (c) => {
    if (c >= 56) return 9000 + c;
    if (c >= 52) return c - 100;
    const s = (c / 13) | 0;
    const r = c % 13;
    const order = s === trump ? 0 : s + 1;
    return order * 100 + (12 - r);
  };
  return hand.slice().sort((a, b) => key(a) - key(b));
}

function handLayout(n) {
  const rows = n > 10 ? 2 : 1;
  const per = rows === 1 ? n : Math.ceil(n / 2);
  const avail = L.W - 20;
  const rowGap = Math.round(L.ch * 0.58);
  const top = 20;
  const pos = [];
  for (let r = 0; r < rows; r++) {
    const cnt = r === 0 ? per : n - per;
    const step = cnt > 1 ? Math.min(L.cw + 6, (avail - L.cw) / (cnt - 1)) : 0;
    const x0 = (L.W - (L.cw + (cnt - 1) * step)) / 2;
    for (let i = 0; i < cnt; i++) pos.push({ x: Math.round(x0 + i * step), y: top + r * rowGap, z: 10 + r * 30 + i });
  }
  return { pos, height: top + L.ch + (rows - 1) * rowGap + 10 };
}

const KINDS = { 2: ['t', 't'], 3: ['l', 't', 'r'], 4: ['l', 't', 't', 'r'], 5: ['l', 't', 't', 't', 'r'] };
function geometry(g) {
  const tb = $('table');
  const W = tb.clientWidth;
  const H = tb.clientHeight;
  const n = g.n;
  const me = g.me < 0 ? 0 : g.me;
  const kinds = KINDS[n - 1];
  const tw = L.cw;
  const th = L.ch;
  const s = tw + 2;
  const sh = 60;
  const top = [];
  let left = -1;
  let right = -1;
  for (let k = 1; k < n; k++) {
    const seat = (me + k) % n;
    const kd = kinds[k - 1];
    if (kd === 't') top.push(seat);
    else if (kd === 'l') left = seat;
    else right = seat;
  }
  const yTop = 10 + sh / 2;
  const bandTop = yTop + sh / 2 + 14;
  const bandBot = H - 8;
  let y1;
  let y2;
  if (bandBot - bandTop >= 2 * th + 8) {
    const mid = (bandTop + bandBot) / 2;
    y1 = mid - th / 2 - 4;
    y2 = mid + th / 2 + 4;
  } else {
    y1 = bandTop + th / 2;
    y2 = Math.max(y1 + th * 0.35, bandBot - th / 2);
  }
  const cx = W / 2;
  const seats = {};
  const slots = {};
  const m = top.length;
  top.forEach((seat, j) => {
    seats[seat] = { x: (W * (j + 1)) / (m + 1), y: yTop };
    slots[seat] = { x: cx + (j - (m - 1) / 2) * s, y: y1, z: 1 + j };
  });
  const ySide = Math.min(H - sh / 2 - 6, Math.max(yTop + sh + 12, (y1 + y2) / 2 - 14));
  if (left >= 0) {
    seats[left] = { x: 6 + L.sw / 2, y: ySide };
    slots[left] = { x: cx - s, y: y2, z: 10 };
  }
  if (right >= 0) {
    seats[right] = { x: W - 6 - L.sw / 2, y: ySide };
    slots[right] = { x: cx + s, y: y2, z: 12 };
  }
  seats[me] = { x: cx, y: H + 70 };
  slots[me] = { x: cx, y: y2, z: 11 };
  return { W, H, seats, slots, tw, th };
}

function makeCard(id) {
  const b = el('button', 'card');
  b.type = 'button';
  b.dataset.c = id;
  b.innerHTML = C.cardSVG(id);
  b.setAttribute('aria-label', C.cardName(id));
  return b;
}

function tallyHTML(bid, tricks, thinking, maxDots) {
  if (bid === null || bid === undefined) return thinking ? '<span class="wait">überlegt</span>' : '';
  if (Math.max(bid, tricks) > (maxDots || 4)) return `<span>${tricks}/${bid}</span>`;
  if (bid === 0 && tricks === 0) return '<span class="zero">0</span>';
  let s = '';
  const m = Math.max(bid, tricks);
  for (let i = 0; i < m; i++) s += `<i class="dot${i < bid ? (i < tricks ? ' won' : '') : ' over'}"></i>`;
  return s;
}

const nameOf = (g, i) => (i === g.me ? 'Du' : g.seats[i].name);

function statusText(g) {
  const me = g.me;
  if (g.phase === 'trump') return g.turn === me ? 'Wähle die Trumpffarbe' : `${nameOf(g, g.dealer)} wählt die Trumpffarbe`;
  if (g.phase === 'bid') return g.turn === me ? 'Deine Ansage' : `${nameOf(g, g.turn)} sagt an`;
  if (g.phase === 'play') {
    if (g.turn !== me) return `${nameOf(g, g.turn)} ist dran`;
    const cards = g.trick.plays.map((p) => p.card);
    if (!cards.length) return 'Du spielst aus';
    const ls = E.leadSuit(cards);
    if (ls >= 0 && g.hand.some((c) => E.suitOf(c) === ls)) return `Du bist dran: ${C.SUITS[ls].name} bedienen`;
    return 'Du bist dran';
  }
  if (g.phase === 'trickEnd') return g.trick.winner === me ? 'Der Stich geht an dich' : `Der Stich geht an ${nameOf(g, g.trick.winner)}`;
  if (g.phase === 'roundEnd') return 'Runde beendet';
  if (g.phase === 'gameEnd') return 'Partie beendet';
  return '';
}

function renderGame() {
  const g = S.game;
  if (!g) return;
  const p = S.prev && S.prev.n === g.n ? S.prev : null;
  computeLayout();
  const hand = sortHand(g.hand, g.trumpSuit);
  const hl = handLayout(hand.length);
  const hBox = $('hand');
  const newH = hl.height + 'px';
  if (hBox.style.height !== newH) hBox.style.height = newH;

  $('gRound').textContent = `Runde ${g.round} von ${g.rounds}`;
  const bids = g.seats.map((s) => s.bid).filter((b) => b !== null);
  const sum = bids.reduce((a, b) => a + b, 0);
  $('gSub').textContent = bids.length === 0 ? `${g.round} ${g.round === 1 ? 'Stich' : 'Stiche'} zu vergeben` : `${bids.length < g.n ? 'Bisher angesagt' : 'Angesagt'}: ${sum} von ${g.round}`;
  renderTrump(g);

  const G = geometry(g);
  renderSeats(g, p, G);
  renderTrick(g, p, G);
  renderHand(g, p, hand, hl);
  renderMeBar(g);
  renderPanel(g);
  renderSheets(g);
  netState();
}

function renderTrump(g) {
  const b = $('gTrump');
  let html;
  if (g.phase === 'trump') html = '<span class="sw"></span><span><small>Trumpf</small>wird gewählt</span>';
  else if (g.trumpSuit >= 0) {
    const su = C.SUITS[g.trumpSuit];
    html = `<span class="sw" style="background:${su.bg};color:${su.fg}">${C.glyphSVG(g.trumpSuit)}</span><span><small>Trumpf</small>${su.name}</span>`;
  } else html = '<span class="sw"></span><span><small>Trumpf</small>keiner</span>';
  if (b._k !== html) {
    b.innerHTML = html;
    b._k = html;
  }
}

function renderSeats(g, p, G) {
  const box = $('seats');
  const key = g.n + ':' + g.me;
  if (S.seatKey !== key) {
    box.innerHTML = '';
    S.seatKey = key;
    for (let k = 1; k < g.n; k++) {
      const i = (g.me + k) % g.n;
      const s = el('div', 'seat');
      s.dataset.seat = i;
      s.innerHTML = '<div class="nm"></div><div class="row"><span class="tally"></span><span class="pts"></span></div>';
      box.appendChild(s);
    }
  }
  for (const s of box.children) {
    const i = +s.dataset.seat;
    const d = g.seats[i];
    const pos = G.seats[i];
    s.style.left = pos.x + 'px';
    s.style.top = pos.y + 'px';
    const away = d.kind === 'human' && (d.online === false || d.away);
    s.classList.toggle('turn', g.turn === i);
    s.classList.toggle('away', away && !d.auto);
    s.querySelector('.nm').textContent = d.name + (d.kind === 'human' && d.auto ? ' (Computer)' : '');
    const th = tallyHTML(d.bid, d.tricks, g.phase === 'bid' && g.turn === i);
    const t = s.querySelector('.tally');
    if (t._k !== th) {
      t.innerHTML = th;
      t._k = th;
    }
    s.querySelector('.pts').textContent = d.score;
    let badge = s.querySelector('.badge');
    if (g.dealer === i && !badge) {
      badge = el('span', 'badge', 'G');
      badge.title = 'Geber';
      s.appendChild(badge);
    } else if (g.dealer !== i && badge) badge.remove();
    if (p && p.round === g.round && p.seats[i].bid === null && d.bid !== null) {
      const old = s.querySelector('.bubble');
      if (old) old.remove();
      const bub = el('span', 'bubble', 'sagt ' + d.bid);
      s.appendChild(bub);
      setTimeout(() => bub.remove(), 2200);
    }
  }
}

function centerOf(r) {
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function renderTrick(g, p, G) {
  const box = $('trick');
  const plays = g.trick.plays;
  const want = new Set(plays.map((pl) => pl.card));
  const anim = !REDUCED && document.visibilityState === 'visible';
  const tb = $('table').getBoundingClientRect();

  /* Karten des vorigen Stichs wandern zum Gewinner */
  const stale = Array.from(box.children).filter((c) => !c._leaving && !want.has(+c.dataset.c));
  if (stale.length) {
    let w = -1;
    if (p && p.trick && p.trick.winner >= 0) w = p.trick.winner;
    else if (g.lastTrick) w = g.lastTrick.winner;
    const target = w >= 0 ? G.seats[w] : null;
    for (const c of stale) {
      c._leaving = true;
      if (!anim || !target) {
        c.remove();
        continue;
      }
      const from = centerOf(c.getBoundingClientRect());
      const dx = tb.left + target.x - from.x;
      const dy = tb.top + Math.min(target.y, G.H + 40) - from.y;
      const a = c.animate([{ transform: c.style.transform, opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) ${c.style.transform} scale(0.35)`, opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' });
      a.onfinish = () => c.remove();
      setTimeout(() => c.remove(), 600);
    }
  }

  plays.forEach((pl) => {
    let c = null;
    for (const x of box.children) if (!x._leaving && +x.dataset.c === pl.card) c = x;
    const slot = G.slots[pl.seat];
    const rot = ((pl.card * 37) % 5) - 2;
    const tf = `translate(${Math.round(slot.x - G.tw / 2)}px, ${Math.round(slot.y - G.th / 2)}px) rotate(${rot}deg)`;
    if (!c) {
      let from = null;
      let scale = 0.4;
      const hEl = pl.seat === g.me ? handEls.get(pl.card) : null;
      if (hEl) {
        from = centerOf(hEl.getBoundingClientRect());
        scale = 1;
        hEl.remove();
        handEls.delete(pl.card);
      } else if (pl.seat !== g.me && G.seats[pl.seat]) {
        from = { x: tb.left + G.seats[pl.seat].x, y: tb.top + G.seats[pl.seat].y };
      }
      c = makeCard(pl.card);
      c.tabIndex = -1;
      c.style.transform = tf;
      box.appendChild(c);
      if (anim && from) {
        const to = centerOf(c.getBoundingClientRect());
        c.animate([{ transform: `translate(${from.x - to.x}px, ${from.y - to.y}px) ${tf} scale(${scale})`, opacity: scale === 1 ? 1 : 0.3 }, { transform: tf, opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
    } else if (c.style.transform !== tf) c.style.transform = tf;
    c.style.zIndex = slot.z;
    const ended = g.phase === 'trickEnd';
    c.classList.toggle('win', ended && g.trick.winner === pl.seat);
    c.classList.toggle('dim', ended && g.trick.winner !== pl.seat);
  });
}

function renderHand(g, p, hand, hl) {
  const box = $('hand');
  const want = new Set(hand);
  for (const [c, node] of handEls) {
    if (!want.has(c)) {
      node.remove();
      handEls.delete(c);
    }
  }
  if (S.sel >= 0 && !want.has(S.sel)) S.sel = -1;
  const dealt = !p || p.round !== g.round;
  const anim = !REDUCED && document.visibilityState === 'visible';
  const myTurn = g.phase === 'play' && g.turn === g.me;
  const legal = new Set(g.legal);
  hand.forEach((c, i) => {
    const pos = hl.pos[i];
    let node = handEls.get(c);
    const lift = S.sel === c ? -16 : 0;
    const tf = `translate(${pos.x}px, ${pos.y + lift}px)`;
    if (!node) {
      node = makeCard(c);
      handEls.set(c, node);
      node.style.transform = tf;
      box.appendChild(node);
      if (dealt && anim) node.animate([{ transform: `translate(${pos.x}px, ${pos.y + 46}px)`, opacity: 0 }, { transform: tf, opacity: 1 }], { duration: 340, delay: i * 38, fill: 'backwards', easing: 'cubic-bezier(.2,.8,.2,1)' });
    } else if (node.style.transform !== tf) node.style.transform = tf;
    node.style.zIndex = pos.z;
    node.classList.toggle('off', myTurn && !legal.has(c));
    node.classList.toggle('sel', S.sel === c);
    node.classList.toggle('pending', S.pending === c);
  });
}

function renderMeBar(g) {
  const bar = $('mebar');
  const me = g.seats[g.me] || g.seats[0];
  const mine = g.turn === g.me && (g.phase === 'play' || g.phase === 'bid' || g.phase === 'trump');
  bar.classList.toggle('turn', mine);
  const html =
    `<span class="st">${esc(statusText(g))}</span>` +
    (g.dealer === g.me ? '<span class="badge gb" title="Geber">G</span>' : '') +
    `<span class="tally">${tallyHTML(me.bid, me.tricks, false, 7)}</span>` +
    `<span class="pts">${me.score}</span>`;
  if (bar._k !== html) {
    bar.innerHTML = html;
    bar._k = html;
  }
}

function renderPanel(g) {
  const panel = $('panel');
  const mine = g.turn === g.me;
  const key = mine && (g.phase === 'bid' || g.phase === 'trump') ? g.round + ':' + g.phase : '';
  if (key === S.panelKey) return;
  S.panelKey = key;
  panel.innerHTML = '';
  panel.hidden = !key;
  if (!key) return;
  if (g.phase === 'trump') {
    panel.appendChild(el('h2', '', 'Du wählst den Trumpf'));
    panel.appendChild(el('p', 'hint', 'Ein Zauberer wurde aufgedeckt. Als Geber bestimmst du die Trumpffarbe.'));
    const grid = el('div', 'suitpick');
    C.SUITS.forEach((su, s) => {
      const b = el('button');
      b.type = 'button';
      b.style.background = su.bg;
      b.style.color = su.fg;
      b.innerHTML = C.glyphSVG(s) + `<span>${su.name}</span>`;
      b.onclick = () => act({ t: 'trump', s });
      grid.appendChild(b);
    });
    panel.appendChild(grid);
    return;
  }
  const r = g.round;
  const bids = g.seats.map((s) => s.bid).filter((b) => b !== null);
  const sum = bids.reduce((a, b) => a + b, 0);
  panel.appendChild(el('h2', '', 'Wie viele Stiche machst du?'));
  let hint = bids.length ? `Bisher angesagt: ${sum} von ${r}.` : `Du sagst als Erster an. Es gibt ${r} ${r === 1 ? 'Stich' : 'Stiche'}.`;
  if (g.noBid >= 0) hint += ` Die ${g.noBid} ist für dich gesperrt (Plus/Minus 1).`;
  panel.appendChild(el('p', 'hint', hint));
  const chips = el('div', 'chips');
  const go = el('button', 'btn primary', 'Ansage wählen');
  go.disabled = true;
  let pick = -1;
  for (let n = 0; n <= r; n++) {
    const b = el('button', 'chip', String(n));
    b.type = 'button';
    b.disabled = n === g.noBid;
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      pick = n;
      for (const x of chips.children) x.setAttribute('aria-pressed', String(x === b));
      go.disabled = false;
      go.textContent = n === 1 ? '1 Stich ansagen' : `${n} Stiche ansagen`;
    };
    chips.appendChild(b);
  }
  go.onclick = () => {
    if (pick < 0) return;
    go.disabled = true;
    act({ t: 'bid', n: pick });
  };
  panel.append(chips, go);
}

async function act(msg) {
  if (!S.session) return;
  const res = await S.session.send(msg);
  if (res && res.error) {
    toast(res.error);
    S.pending = -1;
    S.panelKey = '';
    if (S.game) renderGame();
  }
}

function onHandTap(ev) {
  const node = ev.target.closest('.card');
  const g = S.game;
  if (!node || !g) return;
  const c = +node.dataset.c;
  const myTurn = g.phase === 'play' && g.turn === g.me;
  if (!myTurn) {
    S.sel = S.sel === c ? -1 : c;
    renderGame();
    return;
  }
  if (S.pending >= 0) return;
  if (g.legal.indexOf(c) < 0) {
    const ls = E.leadSuit(g.trick.plays.map((p) => p.card));
    toast(ls >= 0 ? `Du musst ${C.SUITS[ls].name} bedienen.` : 'Diese Karte geht gerade nicht.');
    node.classList.remove('nope');
    void node.offsetWidth;
    node.classList.add('nope');
    return;
  }
  if (settings.oneTap || S.sel === c) {
    S.sel = -1;
    S.pending = c;
    act({ t: 'play', c });
    if (S.game === g) renderGame();
  } else {
    S.sel = c;
    renderGame();
  }
}

/* ---------- Blätter ---------- */
function openSheet(type, title, content, opts) {
  opts = opts || {};
  const sh = $('sheet');
  sh.innerHTML = '';
  const body = el('div', 'sheetbody');
  const head = el('div', 'sheethead');
  head.appendChild(el('h2', '', title));
  if (!opts.sticky) {
    const x = el('button', 'iconbtn');
    x.innerHTML = ICON.close;
    x.setAttribute('aria-label', 'Schließen');
    x.onclick = () => (opts.back ? opts.back() : closeSheet());
    head.appendChild(x);
  }
  const sc = el('div', 'scroll');
  sc.style.minHeight = '0';
  sc.appendChild(content);
  body.append(head, sc);
  if (opts.footer) body.appendChild(opts.footer);
  sh.appendChild(body);
  sh.hidden = false;
  sh.onclick = (ev) => {
    if (ev.target === sh && !opts.sticky) (opts.back || closeSheet)();
  };
  S.sheet = { type };
}

function closeSheet() {
  $('sheet').hidden = true;
  $('sheet').innerHTML = '';
  S.sheet = null;
}

function resultsList(g, h) {
  const order = g.seats.map((_, i) => i).sort((a, b) => h.totals[b] - h.totals[a]);
  const ul = el('ul', 'results');
  for (const i of order) {
    const li = el('li', i === g.me ? 'me' : '');
    li.appendChild(el('span', 'nm', nameOf(g, i)));
    const d = h.deltas[i];
    li.appendChild(el('span', 'dl ' + (d > 0 ? 'good' : 'bad'), (d > 0 ? '+' : '−') + Math.abs(d)));
    li.appendChild(el('span', 'tt', String(h.totals[i])));
    li.appendChild(el('span', 'sub', `${h.bids[i]} angesagt, ${h.tricks[i]} gemacht`));
    ul.appendChild(li);
  }
  return ul;
}

function roundFooter(g) {
  const foot = el('div', 'stack');
  const me = g.seats[g.me];
  const last = g.round >= g.rounds;
  const waiting = g.seats.filter((s, i) => s.kind === 'human' && i !== g.me && !s.ready && !s.auto && s.online !== false && !s.away).map((s) => s.name);
  const b = el('button', 'btn primary', me && me.ready ? (waiting.length ? 'Warte auf ' + waiting.join(', ') : 'Gleich geht es weiter') : last ? 'Endstand ansehen' : 'Nächste Runde');
  b.disabled = !!(me && me.ready);
  b.onclick = () => {
    b.disabled = true;
    act({ t: 'ready' });
  };
  const blk = el('button', 'btn plain', 'Block ansehen');
  blk.onclick = () => openBlock(() => openRoundEnd(S.game));
  foot.append(b, blk);
  return foot;
}

function openRoundEnd(g) {
  if (!g || g.phase !== 'roundEnd') {
    closeSheet();
    return;
  }
  const h = g.history[g.history.length - 1];
  openSheet('round', `Runde ${h.round} gewertet`, resultsList(g, h), { sticky: true, footer: roundFooter(g) });
}

function openGameEnd(g) {
  const h = g.history[g.history.length - 1];
  const wn = g.winners.map((i) => nameOf(g, i));
  const iWon = g.winners.indexOf(g.me) >= 0;
  const title = iWon ? (wn.length > 1 ? 'Geteilter Sieg für dich' : 'Du gewinnst die Partie') : wn.length > 1 ? `${wn.join(' und ')} teilen sich den Sieg` : `${wn[0]} gewinnt die Partie`;
  const order = g.seats.map((_, i) => i).sort((a, b) => g.seats[b].score - g.seats[a].score);
  const ul = el('ul', 'results');
  order.forEach((i) => {
    const li = el('li', i === g.me ? 'me' : '');
    li.appendChild(el('span', 'nm', nameOf(g, i)));
    li.appendChild(el('span', 'dl', ''));
    li.appendChild(el('span', 'tt', String(g.seats[i].score)));
    const hits = g.history.filter((x) => x.bids[i] === x.tricks[i]).length;
    li.appendChild(el('span', 'sub', `${hits} von ${g.history.length} Ansagen getroffen`));
    ul.appendChild(li);
  });
  const foot = el('div', 'stack');
  const solo = S.session && S.session.kind === 'solo';
  if (solo) {
    store.del('zs.solo');
    const again = el('button', 'btn primary', 'Neue Partie');
    again.onclick = startSolo;
    foot.appendChild(again);
  } else if (S.room && S.room.owner) {
    const again = el('button', 'btn primary', 'Zurück in den Warteraum');
    again.onclick = () => act({ t: 'again' });
    foot.appendChild(again);
  } else {
    foot.appendChild(el('p', 'hint', 'Wer den Raum eröffnet hat, kann eine neue Partie starten.'));
  }
  const blk = el('button', 'btn plain', 'Block ansehen');
  blk.onclick = () => openBlock(() => openGameEnd(S.game));
  const home = el('button', 'btn plain', solo ? 'Zum Start' : 'Raum verlassen');
  home.onclick = () => {
    if (!solo) store.del('zs.mp');
    leaveSession(true);
    goHome();
  };
  foot.append(blk, home);
  void h;
  openSheet('end', title, ul, { sticky: true, footer: foot });
}

function renderSheets(g) {
  if (g.phase === 'roundEnd') {
    if (S.shownRound !== g.round) {
      S.shownRound = g.round;
      openRoundEnd(g);
    } else if (S.sheet && S.sheet.type === 'round') openRoundEnd(g);
  } else if (S.sheet && S.sheet.type === 'round') closeSheet();
  if (g.phase === 'gameEnd') {
    if (!S.shownEnd) {
      S.shownEnd = true;
      openGameEnd(g);
    }
  } else {
    if (S.sheet && S.sheet.type === 'end') closeSheet();
    S.shownEnd = false;
  }
}

function openBlock(back) {
  const g = S.game;
  if (!g) return;
  const wrap = el('div');
  const tbl = el('table', 'block');
  const thead = el('tr');
  thead.appendChild(el('th', '', ''));
  g.seats.forEach((s, i) => thead.appendChild(el('th', '', nameOf(g, i))));
  tbl.appendChild(thead);
  for (const h of g.history) {
    const tr = el('tr');
    const td0 = el('td');
    const rs = el('span', 'rs', String(h.round));
    if (h.trumpSuit >= 0) {
      rs.style.background = C.SUITS[h.trumpSuit].bg;
      rs.style.color = C.SUITS[h.trumpSuit].fg;
    }
    td0.appendChild(rs);
    tr.appendChild(td0);
    g.seats.forEach((s, i) => {
      const td = el('td', h.bids[i] === h.tricks[i] ? 'hit' : '');
      td.appendChild(el('b', '', String(h.totals[i])));
      td.appendChild(el('small', '', `${h.tricks[i]} von ${h.bids[i]}`));
      tr.appendChild(td);
    });
    tbl.appendChild(tr);
  }
  wrap.appendChild(tbl);
  wrap.appendChild(el('p', 'hint', g.history.length ? 'Fett: Punktestand nach der Runde. Darunter: gemachte Stiche von angesagten, grün bei Treffer. Die Farbe an der Rundennummer ist der Trumpf.' : 'Noch keine Runde gewertet.'));
  wrap.lastChild.style.marginTop = '10px';
  openSheet('block', 'Block', wrap, { back });
}

function openRules(back) {
  const node = $('rulesTpl').content.cloneNode(true);
  const leg = node.querySelector('#legend');
  const items = [
    [E.cardId(0, 13), 'Glut', 'rot, Feuer'],
    [E.cardId(1, 8), 'Flut', 'blau, Wellen'],
    [E.cardId(2, 5), 'Laub', 'grün, Blätter'],
    [E.cardId(3, 2), 'Licht', 'gelb, Strahlen'],
    [52, 'Zauberer', 'gewinnt immer'],
    [56, 'Narr', 'gewinnt nie'],
    [-1, 'Rückseite', ''],
  ];
  for (const [id, name, sub] of items) {
    const f = el('figure');
    const c = el('div', 'card');
    c.innerHTML = id >= 0 ? C.cardSVG(id) : C.backSVG();
    const cap = el('figcaption');
    cap.appendChild(el('b', '', name));
    cap.appendChild(document.createTextNode(sub));
    f.append(c, cap);
    leg.appendChild(f);
  }
  const wrap = el('div');
  wrap.appendChild(node);
  openSheet('rules', 'Regeln und Karten', wrap, { back });
}

function openTrumpInfo() {
  const g = S.game;
  if (!g) return;
  const wrap = el('div', 'stack');
  let text;
  if (g.trumpCard < 0) text = 'In der letzten Runde sind alle Karten verteilt. Es gibt keinen Trumpf.';
  else if (E.isJester(g.trumpCard)) text = 'Ein Narr wurde aufgedeckt. In dieser Runde gibt es keinen Trumpf.';
  else if (E.isWizard(g.trumpCard)) text = g.phase === 'trump' ? `Ein Zauberer wurde aufgedeckt. ${nameOf(g, g.dealer)} wählt als Geber die Trumpffarbe.` : `Ein Zauberer wurde aufgedeckt. ${nameOf(g, g.dealer)} hat ${C.SUITS[g.trumpSuit].name} als Trumpf gewählt.`;
  else text = `Aufgedeckt wurde ${C.cardName(g.trumpCard)}. ${C.SUITS[g.trumpSuit].name} ist Trumpf und sticht jede andere Farbe.`;
  if (g.trumpCard >= 0) {
    const row = el('div', 'minirow');
    const c = el('div', 'card');
    c.style.setProperty('--cw', '96px');
    c.innerHTML = C.cardSVG(g.trumpCard);
    row.appendChild(c);
    wrap.appendChild(row);
  }
  wrap.appendChild(el('p', '', text));
  openSheet('trump', 'Trumpf', wrap);
}

function openLastTrick() {
  const g = S.game;
  const wrap = el('div', 'stack');
  if (!g || !g.lastTrick) wrap.appendChild(el('p', 'hint', 'In dieser Runde wurde noch kein Stich gemacht.'));
  else {
    const row = el('div', 'minirow');
    g.lastTrick.plays.forEach((pl) => {
      const f = el('figure');
      f.style.margin = '0';
      const c = el('div', 'card');
      c.innerHTML = C.cardSVG(pl.card);
      const cap = el('figcaption', 'hint', nameOf(g, pl.seat));
      if (pl.seat === g.lastTrick.winner) cap.style.fontWeight = '700';
      f.append(c, cap);
      row.appendChild(f);
    });
    wrap.appendChild(row);
    wrap.appendChild(el('p', '', `Der Stich ging an ${g.lastTrick.winner === g.me ? 'dich' : nameOf(g, g.lastTrick.winner)}.`));
  }
  openSheet('last', 'Letzter Stich', wrap, { back: openMenu });
}

function switchRow(title, sub, on, onToggle) {
  const sw = el('button', 'switch');
  sw.setAttribute('role', 'switch');
  sw.setAttribute('aria-checked', String(on));
  sw.innerHTML = `<span><b>${esc(title)}</b><span>${esc(sub)}</span></span><span class="knob"></span>`;
  sw.onclick = () => {
    on = !on;
    sw.setAttribute('aria-checked', String(on));
    onToggle(on);
  };
  return sw;
}

function openMenu() {
  const g = S.game;
  const menu = el('div', 'menu');
  const add = (label, fn, cls) => {
    const b = el('button', 'btn ' + (cls || 'plain'), label);
    b.onclick = fn;
    menu.appendChild(b);
    return b;
  };
  add('Block ansehen', () => openBlock(openMenu));
  add('Letzter Stich', openLastTrick);
  add('Regeln und Karten', () => openRules(openMenu));
  menu.appendChild(
    switchRow('Karte mit einem Tipp spielen', 'Sonst hebst du die Karte erst an und tippst noch einmal.', settings.oneTap, (v) => {
      settings.oneTap = v;
      saveSettings();
    })
  );
  const solo = S.session && S.session.kind === 'solo';
  if (solo) {
    menu.appendChild(
      switchRow('Schnelles Tempo', 'Die Computergegner spielen zügiger.', settings.fast, (v) => {
        settings.fast = v;
        saveSettings();
        S.session.host.setSpeed(v ? 0.55 : 1);
      })
    );
  } else if (S.room && S.room.owner && g) {
    g.seats.forEach((s, i) => {
      if (s.kind !== 'human' || i === g.me) return;
      if (s.online === false || s.auto) {
        add(s.auto ? `${s.name} spielt wieder selbst` : `Computer spielt für ${s.name}`, () => {
          act({ t: 'auto', seat: i, on: !s.auto });
          closeSheet();
        });
      }
    });
    add('Partie abbrechen, zurück in den Warteraum', () => {
      closeSheet();
      act({ t: 'end' });
    });
  }
  if (S.room) menu.appendChild(el('p', 'hint', `Raumcode ${S.room.code}`));
  add(solo ? 'Zum Start (Partie bleibt gespeichert)' : 'Raum verlassen', () => {
    if (!solo) store.del('zs.mp');
    leaveSession(true);
    goHome();
  });
  openSheet('menu', 'Menü', menu);
}

/* ---------- Testhilfe: spielt die eigenen Züge automatisch (?auto=1) ---------- */
function autopilot() {
  if (!S.auto) return;
  clearTimeout(autopilot.t);
  autopilot.t = setTimeout(() => {
    const g = S.game;
    if (!g || !S.session || !S.auto) return;
    const me = g.me;
    if (g.phase === 'trump' && g.turn === me) S.session.send({ t: 'trump', s: 1 });
    else if (g.phase === 'bid' && g.turn === me) {
      let b = Math.min(g.round, Math.round(g.hand.length / g.n));
      if (b === g.noBid) b = b ? b - 1 : 1;
      S.session.send({ t: 'bid', n: b });
    } else if (g.phase === 'play' && g.turn === me && g.legal.length) S.session.send({ t: 'play', c: g.legal[0] });
    else if (g.phase === 'roundEnd' && !g.seats[me].ready && !S.autoHold) S.session.send({ t: 'ready' });
  }, 60);
}

/* ---------- Start der App ---------- */
function init() {
  for (const b of document.querySelectorAll('[data-back]')) {
    b.innerHTML = ICON.back;
    b.onclick = goHome;
  }
  $('mBack').innerHTML = ICON.back;
  $('mBack').onclick = () => {
    if (S.session && S.session.kind !== 'solo') {
      store.del('zs.mp');
      leaveSession(true);
    }
    goHome();
  };
  $('gMenu').innerHTML = ICON.menu;
  $('gMenu').onclick = openMenu;
  $('gTrump').onclick = openTrumpInfo;
  $('hSolo').onclick = () => {
    renderSolo();
    show('solo');
  };
  $('hFriends').onclick = () => renderMpEnter(S.mpMsg);
  $('hRules').onclick = () => openRules();
  $('sPm1').onclick = () => {
    settings.pm1 = !settings.pm1;
    saveSettings();
    renderSolo();
  };
  $('sStart').onclick = startSolo;
  $('hand').addEventListener('click', onHandTap);
  window.addEventListener('resize', () => {
    if (S.game && S.screen === 'game') {
      S.prev = S.game;
      renderGame();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (S.session && S.session.link) S.session.link.kick();
    if (S.game) {
      keepAwake();
      S.prev = S.game;
      renderGame();
    }
  });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  setInterval(netState, 3000);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !inClaude()) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  renderHome();
  show('home');
  const mp = store.get('zs.mp', null);
  const code = Net.normCode(QS.get('r') || '');
  if (!inClaude() && mp && Date.now() - mp.at < 30 * 60e3 && (!code || code === mp.code)) resumeRoom(mp);
  else if (code.length === 5 && !inClaude()) renderMpEnter('');
  else if (QS.get('solo') === '1') startSolo();
  window.__zs = { S, settings, store, poke: autopilot };
}

init();

return module.exports;})(__req);
})();
</script>
